<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面談対策トレーナー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{--ink:#1B2430;--muted:#55606E;--line:#D9DEE5;--ground:#F4F6F9;--card:#FFFFFF;--accent:#1F5FBF;--accent-d:#174A94;--accent-soft:#E8F0FC;--good:#17663A;--good-bg:#E6F4EC;--warn:#8A4B08;--warn-bg:#FDF1E3;--rec:#B3261E;--track:#DDE3EB}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;font-family:'Noto Sans JP','Hiragino Sans','Meiryo',system-ui,sans-serif;color:var(--ink);background:var(--ground)}
button,select{font-family:inherit}
button{cursor:pointer}
textarea,input[type=text],input[type=password],select{font-family:inherit;color:var(--ink);width:100%;border:1px solid #B8C0CC;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7;background:#fff}
select{padding:8px 10px}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:3px solid #9DBDF0;outline-offset:1px}

/* ---- 骨格：ヘッダー / スクロール領域 / 下部固定バー ---- */
.top{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;min-height:56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.step{font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:#E8ECF2;color:#3D4856}
.step.on{background:var(--accent);color:#fff}
#main{flex:1;min-height:0;overflow:auto;padding:16px 24px}
.wrap{max-width:1040px;margin:0 auto}
#bar{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 24px}
#bar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:48px}
.grow{flex:1;min-width:0}

/* ---- 共通レイアウト：全画面で同じ2カラム・同じ余白 ---- */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col>.card.fill{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:15px;margin:0}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.lb{font-size:13px;font-weight:500}
.tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);white-space:nowrap}

/* ---- ボタン ---- */
.btn{min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{background:#A9B4C4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--accent-d);border:1px solid var(--accent)}
.btn.ghost:disabled{background:#F1F3F6;color:#8A94A3;border-color:#C5CCD6}
.btn.rec{background:var(--rec)}
.btn.min{min-height:40px;padding:0 16px;font-size:14px}
.btn.plain{background:none;color:var(--muted);font-weight:500;padding:0 10px;text-decoration:underline}
.opt{min-height:60px;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 14px;border-radius:10px;border:1px solid #B8C0CC;background:#fff;color:#3D4856}
.opt b{font-size:14px}.opt span{font-size:12px}
.opt.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.opt:disabled{opacity:.6;cursor:not-allowed;background:#F4F6F9}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:8px;border:1px solid #B8C0CC;background:#fff;font-size:14px;font-weight:700;color:#3D4856}
.seg button.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
.chk input{width:18px;height:18px;margin-top:3px;flex:none}
.drop{border:2px dashed #9AA7B8;border-radius:10px;padding:14px 18px;background:#FAFBFD;display:flex;justify-content:space-between;align-items:center;gap:16px}
.drop.has{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.drop .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:0;font-size:15px;font-weight:700;color:var(--ink);text-align:left;min-height:28px}
.acc .sum{font-size:12px;font-weight:400;color:var(--muted)}
.opts-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-top:6px}
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}
.row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FAFBFD}

/* ---- 質問画面 ---- */
.prog{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.prog b{font-size:14px;white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:4px;flex:1}.bar>div{height:100%;border-radius:4px;background:var(--accent)}
.bar.t{height:10px;border-radius:5px}.bar>div.low{background:#B4540A}
.qtext{font-size:22px;font-weight:700;line-height:1.6;margin:0}
.center{align-items:center;justify-content:center;text-align:center}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:40px}
.wave i{display:block;width:5px;border-radius:3px;background:#B8C0CC}
.wave.on i{background:var(--rec);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.tbox{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:110px;max-height:190px;overflow:auto;font-size:15px;line-height:1.9;width:100%;white-space:pre-wrap;text-align:left}
.vt{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--accent);background:#fff;color:var(--accent-d);font-size:13px;font-weight:700}
.vt[aria-pressed=false]{border-color:#B8C0CC;color:var(--muted);background:#F4F6F9}
.vt:disabled{opacity:.5;cursor:not-allowed}

/* ---- フィードバック・結果 ---- */
.split{display:flex;align-items:baseline;gap:8px}
.score{font-size:40px;font-weight:700;color:var(--accent-d);margin-left:auto;line-height:1}
.big-score{font-size:52px;font-weight:700;color:var(--accent-d);line-height:1}
.evalbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.evalbox .radar{flex:0 0 230px;max-width:100%}
.evalbox .axes{flex:1;min-width:170px;display:flex;flex-direction:column;gap:10px}
.axis{display:flex;flex-direction:column;gap:5px;font-size:13px}.axis>div:first-child{display:flex;justify-content:space-between}
.sec h3{font-size:13px;margin:0 0 4px}
.sec p{font-size:14px;line-height:1.8;margin:0}
.sec.good h3{color:var(--good)}.sec.warn h3{color:var(--warn)}
.sec+.sec{border-top:1px solid var(--line);padding-top:10px}
.model{background:var(--accent-soft);border-color:#BFD3F2}
.model h2,.model h3{color:var(--accent-d)}
.model h3{font-size:13px;margin:0 0 6px}
.model p{font-size:14px;line-height:1.9;margin:0}
.scroll{overflow:auto;max-height:230px}
.tbl-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E6EAF0}
.tbl-row .tx{flex:1;font-size:14px;line-height:1.6;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.5}
.stat b{font-size:16px;display:block}
.tip{background:var(--warn-bg);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7}
.tip b{display:block;color:var(--warn);margin-bottom:2px}
mark.m1{background:#FFD9B0;color:#5A2E00;border-radius:3px;padding:0 2px;border-bottom:2px solid #B4540A}
mark.m2{background:#FFF0B3;color:#5A4600;border-radius:3px;padding:0 2px;border-bottom:2px dashed #B48A00}
.err{background:#FDECEA;border:1px solid #F2B8B5;color:#7A1A14;border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.7;margin-bottom:16px}
.okmsg{background:var(--good-bg);border:1px solid #B9DEC8;color:var(--good);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7}
.ov{position:fixed;inset:0;background:rgba(244,246,249,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
.spin{width:44px;height:44px;border:5px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){.g2,.opts-body,.login{grid-template-columns:1fr}body{overflow:auto}#main{overflow:visible}#bar .in{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top">
  <h1>面談対策トレーナー</h1>
  <div class="steps" id="steps"></div>
</div>
<div id="main"><div class="wrap" id="app"></div></div>
<div id="bar"><div class="in" id="barin"></div></div>
<div id="ov" class="ov" style="display:none"><div class="spin"></div><div id="ovmsg" style="font-weight:700"></div></div>

<script>
/* ================= 設定（接続先は config.js で指定） ================= */
var API_URL = (window.APP_CONFIG && window.APP_CONFIG.API_URL) || '';
var API_OK = !!API_URL && !/YOUR-DEPLOYMENT-ID/.test(API_URL);

var MAMMOTH_URL = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
var PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
var PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

/* ================= 定数・状態 ================= */
var CATS = {
  hr:   { label: '人事・自己PR', sub: '経歴説明から開始／長所短所・志望動機' },
  tech: { label: 'テクニカル', sub: '技術選定・設計・トラブル対応' },
  biz:  { label: '業務・コミュニケーション', sub: '報連相・要件確認・進捗管理' },
  proj: { label: '案件・経験', sub: '直近案件の役割・課題・成果' },
  pj:   { label: '案件詳細ベース', sub: '提案先の案件内容に合わせた質問', need: 'project', needMsg: 'オプション設定で案件詳細を入力すると選べます' },
  prep: { label: '面談対策資料ベース', sub: '取り込んだ資料の内容から出題', need: 'prep', needMsg: 'オプション設定で面談対策資料を取り込むと選べます' }
};
var CAT_ORDER = ['hr', 'tech', 'biz', 'proj', 'pj', 'prep'];
var LEVELS = [['jr', '若手'], ['mid', '中堅'], ['lead', 'リード']];
var LEVEL_LABEL = { jr: '若手', mid: '中堅', lead: 'リード' };
var LEVEL_DESC = {
  jr: '基礎知識・学習姿勢・指示を受けて動いた経験を中心に出題します。',
  mid: '設計判断・改善・トラブル対応・調整力を中心に、「なぜ」を深掘りします。',
  lead: '意思決定・リスク管理・チーム運営・顧客折衝を、状況設定つきの質問で問います。'
};
var AXES = [['conclusion', '結論ファースト', '結論'], ['concreteness', '具体性', '具体性'], ['depth', '内容の深さ', '深さ'], ['concise', '簡潔さ', '簡潔']];
var STEPS = [['setup', '1 設定'], ['question', '2 音声で回答'], ['feedback', '3 フィードバック'], ['result', '4 結果']];
var TIPS = {
  conclusion: ['結論を先に話す', '経験や背景から話し始める傾向があります。最初の一文で答えを言い切る練習をしましょう。'],
  concreteness: ['数字と場面を入れる', '規模・期間・改善率などの数値や、具体的な場面があると説得力が上がります。'],
  depth: ['理由まで話す', '「何をしたか」に加えて「なぜそうしたか」「他の選択肢との比較」まで話せると深さが伝わります。'],
  concise: ['90秒にまとめる', '要点を2〜3個に絞り、結論→理由→具体例の順で話しましょう。']
};

// フィラー判定（「あの」「その」単体は指示語との区別がつかないため対象外）
var RE_STRONG = '(?:えーっと|えーと|えっと|ええと|えー|あのー|あのう|そのー|うーん|んー|あー|まー|まあ)';
var RE_HABIT = '(?:なんか|ちょっと|やっぱり|やっぱ|一応|とりあえず|なんていうか|何というか|みたいな)';

var S = {
  screen: 'setup', skillText: '', skillFile: '', skillInfo: '', projectText: '', prepText: '', prepInfo: '',
  engineerName: '', engineerNameTouched: false, saveText: true,
  userName: '', token: '', loginOpen: false,
  mask: true, maskWords: '', cats: { hr: true, tech: true, biz: true, proj: true, pj: false, prep: false }, level: 'mid',
  autoRead: true, autoRec: true, qVoice: true, voiceName: '', rate: 1.0,
  questions: [], idx: 0, results: [], transcript: '', stats: null, answered: false, recording: false, finalizing: false, secs: 0,
  fb: null, error: '', saveMsg: '', saved: false, saving: false, sessionId: '', finishedAt: null,
  status: null, optOpen: false, micOk: null, micMsg: ''
};

/* ================= ユーティリティ ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function busy(msg) { $('ov').style.display = msg ? 'flex' : 'none'; $('ovmsg').textContent = msg || ''; }
function mmss(n) { return ('0' + Math.floor(n / 60)).slice(-2) + ':' + ('0' + (n % 60)).slice(-2); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function effName() { return (S.engineerNameTouched ? S.engineerName : S.userName).trim() || S.userName; }
function hasProject() { return S.projectText.trim().length >= 20; }
function hasPrep() { return S.prepText.trim().length >= 30; }
function catAvailable(k) { var n = CATS[k].need; return !n || (n === 'project' ? hasProject() : hasPrep()); }

/** GAS API 呼び出し（text/plain で送ることで CORS のプリフライトを避ける） */
function api(action, payload) {
  if (!API_OK) return Promise.reject(new Error('接続先が未設定です。config.js の API_URL に、GASの「/exec」のURLを設定してください。'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, token: S.token, user: S.userName, payload: payload || {} })
  }).then(function (r) { return r.text(); }).then(function (txt) {
    var j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('サーバーの応答を解釈できません。GASのデプロイが「アクセスできるユーザー：全員」になっているか確認してください。'); }
    if (!j.ok) throw new Error(j.error || 'サーバーでエラーが発生しました。');
    return j.data;
  }, function () { throw new Error('サーバーに接続できません。ネットワークとconfig.jsのAPI_URLを確認してください。'); });
}

/** 個人情報の簡易マスク（Geminiへ送る前にブラウザ側で実行） */
function maskText(t) {
  if (!S.mask) return t;
  var out = String(t);
  S.maskWords.split(/[,、\n]/).map(function (w) { return w.trim(); }).filter(Boolean).forEach(function (w) { out = out.split(w).join('○○'); });
  return out
    .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[メール]')
    .replace(/https?:\/\/[^\s]+/g, '[URL]')
    .replace(/0\d{1,4}[-ー−‐]?\d{1,4}[-ー−‐]?\d{3,4}/g, '[電話]')
    .replace(/〒?\s?\d{3}[-ー−‐]\d{4}/g, '[郵便番号]');
}

/* ================= フィラー分析 ================= */
function countMatches(text, reSrc) {
  var re = new RegExp(reSrc, 'g'), m, map = {}, n = 0;
  while ((m = re.exec(text))) { map[m[0]] = (map[m[0]] || 0) + 1; n++; }
  return { map: map, n: n };
}
function analyze(text) {
  var s = countMatches(text, RE_STRONG), h = countMatches(text, RE_HABIT);
  var chars = String(text).replace(/[\s、。，．,.!?！？]/g, '').length;
  return { strong: s.map, s: s.n, habit: h.map, h: h.n, chars: chars };
}
function highlight(text) {
  var re = new RegExp('(' + RE_STRONG + ')|(' + RE_HABIT + ')', 'g'), out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index)) + '<mark class="' + (m[1] ? 'm1' : 'm2') + '">' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function listCounts(map) { return Object.keys(map).map(function (k) { return esc(k) + ' ×' + map[k]; }).join('　'); }
function listCountsPlain(map) { return Object.keys(map).map(function (k) { return k + '×' + map[k]; }).join('、'); }
function paceOf(sp) { return (sp && sp.stats && sp.stats.secs >= 10) ? Math.round(sp.an.chars / (sp.stats.secs / 60)) : null; }

/* ================= ファイル取り込み（Excel / Word / PDF） ================= */
var loadedLibs = {};
function loadScript(url) {
  return new Promise(function (resolve, reject) {
    if (loadedLibs[url]) return resolve();
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { loadedLibs[url] = true; resolve(); };
    s.onerror = function () { reject(new Error('読み込み用のライブラリを取得できませんでした。ネットワークを確認してください。')); };
    document.head.appendChild(s);
  });
}
function readBuffer(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function (e) { resolve(e.target.result); };
    r.onerror = function () { reject(new Error('ファイルを読み込めませんでした。')); };
    r.readAsArrayBuffer(file);
  });
}
function excelToText(buf) {
  var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
  var parts = [], rows = 0;
  wb.SheetNames.forEach(function (name) {
    var data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, defval: '' });
    var lines = [];
    data.forEach(function (r) {
      var cells = r.map(function (c) { return String(c).replace(/\s+/g, ' ').trim(); }).filter(Boolean);
      if (cells.length) lines.push(cells.join(' | '));
    });
    if (lines.length) { rows += lines.length; parts.push('■シート: ' + name + '\n' + lines.join('\n')); }
  });
  return { text: parts.join('\n\n'), sheets: wb.SheetNames.length, rows: rows };
}
function extractText(file) {
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  return readBuffer(file).then(function (buf) {
    if (ext === 'xlsx' || ext === 'xls') return excelToText(buf).text;
    if (ext === 'docx') {
      return loadScript(MAMMOTH_URL).then(function () { return window.mammoth.extractRawText({ arrayBuffer: buf }); }).then(function (r) { return r.value; });
    }
    if (ext === 'pdf') {
      return loadScript(PDFJS_URL).then(function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      }).then(function (pdf) {
        var n = Math.min(pdf.numPages, 40), jobs = [];
        for (var i = 1; i <= n; i++) {
          jobs.push(pdf.getPage(i).then(function (pg) { return pg.getTextContent(); }).then(function (tc) { return tc.items.map(function (it) { return it.str; }).join(' '); }));
        }
        return Promise.all(jobs).then(function (a) { return a.join('\n'); });
      });
    }
    throw new Error('対応していない形式です（.xlsx / .xls / .docx / .pdf）');
  });
}

function readSkillExcel(file) {
  busy('Excelを読み込んでいます…');
  readBuffer(file).then(function (buf) {
    var r = excelToText(buf);
    if (!r.text) throw new Error('読み取れる内容がありませんでした。');
    S.skillText = r.text.slice(0, 20000);
    S.skillFile = file.name;
    S.skillInfo = r.sheets + 'シート／' + r.rows + '行を取り込みました' + (r.text.length > 20000 ? '（長いため先頭20,000文字のみ）' : '');
    S.error = '';
  }).catch(function (err) {
    S.error = 'Excelの読み込みに失敗しました：' + err.message + '（.xlsx / .xls 形式か確認してください）';
  }).then(function () { busy(''); render(); });
}

function readPrepFiles(files) {
  var list = Array.prototype.slice.call(files);
  if (!list.length) return;
  busy('面談対策資料を読み込んでいます…');
  var parts = [], names = [], errors = [];
  list.reduce(function (p, f) {
    return p.then(function () {
      return extractText(f).then(function (t) {
        t = String(t || '').trim();
        if (t.length < 30) throw new Error('文字を抽出できませんでした（画像のPDFなどには未対応）');
        parts.push('■資料: ' + f.name + '\n' + t);
        names.push(f.name);
      }).catch(function (e) { errors.push(f.name + '：' + e.message); });
    });
  }, Promise.resolve()).then(function () {
    if (parts.length) {
      var all = parts.join('\n\n');
      S.prepText = all.slice(0, 20000);
      S.prepInfo = names.join('、') + '（' + Math.min(all.length, 20000).toLocaleString() + '文字' + (all.length > 20000 ? '、長いため先頭のみ' : '') + '）';
    }
    S.error = errors.length ? '取り込めなかった資料：' + errors.join(' ／ ') : '';
    busy(''); render();
  });
}

/* ================= 質問の読み上げ（音声選択・速度調整） ================= */
var speakTok = 0;
function jaVoices() {
  try { return window.speechSynthesis.getVoices().filter(function (v) { return /^ja/i.test(v.lang); }); } catch (e) { return []; }
}
function voiceScore(v) {
  var n = v.name || '', s = 0;
  if (/natural/i.test(n)) s += 100;
  if (/online/i.test(n)) s += 80;
  if (/google/i.test(n)) s += 60;
  if (/nanami|keita|aoi|mayu|shiori|daichi/i.test(n)) s += 50;
  if (/kyoko|otoya|siri/i.test(n)) s += 30;
  if (/microsoft/i.test(n)) s += 20;
  if (!v.localService) s += 10;
  return s;
}
function pickVoice() {
  var vs = jaVoices(), i;
  if (S.voiceName) { for (i = 0; i < vs.length; i++) { if (vs[i].name === S.voiceName) return vs[i]; } }
  var best = null, bs = -1;
  vs.forEach(function (v) { var s = voiceScore(v); if (s > bs) { bs = s; best = v; } });
  return best;
}
function fillVoiceSelect() {
  var sel = $('vsel'); if (!sel) return;
  var vs = jaVoices().slice().sort(function (a, b) { return voiceScore(b) - voiceScore(a); });
  var h = '<option value="">自動（おすすめの声を選択）</option>';
  vs.forEach(function (v) { h += '<option value="' + esc(v.name) + '"' + (v.name === S.voiceName ? ' selected' : '') + '>' + esc(v.name) + '</option>'; });
  sel.innerHTML = h;
}
function stopSpeak() { speakTok++; try { window.speechSynthesis.cancel(); } catch (e) {} }
function speak(text, done) {
  if (!('speechSynthesis' in window)) { if (done) done(); return; }
  stopSpeak();
  var tok = speakTok;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = S.rate || 1.0; u.pitch = 1.0;
  var v = pickVoice(); if (v) u.voice = v;
  u.onend = function () { if (tok === speakTok && done) done(); };
  u.onerror = function () { if (tok === speakTok && done) done(); };
  window.speechSynthesis.speak(u);
}

function onQuestionShown() {
  var q = S.questions[S.idx];
  S.qVoice = S.autoRead;          // 質問ごとの音声は、既定では設定（自動読み上げ）に従う
  var tok = ++speakTok;
  var after = function () {
    if (tok !== speakTok || S.screen !== 'question' || S.answered || S.recording) return;
    if (S.autoRec) startRec();
  };
  if (S.qVoice) { render(); setTimeout(function () { if (tok === speakTok) speak(q.text, after); }, 300); }
  else { after(); }
}

function toggleQVoice() {
  if (S.recording || S.finalizing) return;
  var q = S.questions[S.idx];
  S.qVoice = !S.qVoice;
  if (!S.qVoice) {
    stopSpeak(); render();
    if (S.autoRec && !S.answered) startRec();
  } else {
    render();
    var tok = ++speakTok;
    speak(q.text, function () {
      if (tok === speakTok && S.autoRec && !S.answered && !S.recording && S.screen === 'question') startRec();
    });
  }
}

/* ================= マイク・音声認識 ================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recTimer = null, finTimer = null, finalText = '', interimText = '', lastEvt = 0, pauses = [], stopping = false, finalized = true;

function micErrorMsg(err) {
  var n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'マイクの使用がブロックされています。アドレスバー左のアイコンから「マイク」を「許可」に変更し、ページを再読み込みしてください。';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'マイクが見つかりません。接続と、Chromeのマイク設定（使用するデバイス）を確認してください。';
  if (n === 'NotReadableError') return 'マイクを使用できません。他のアプリ（Web会議など）がマイクを使用中でないか確認してください。';
  if (n === 'Unsupported') return 'このブラウザではマイクを利用できません。Google Chromeをお使いください。';
  return 'マイクを開始できませんでした。文字で回答を入力することもできます。';
}
function ensureMic() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return Promise.reject({ name: 'Unsupported' });
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) { st.getTracks().forEach(function (t) { t.stop(); }); S.micOk = true; });
}
function checkMic() {
  ensureMic().then(function () { S.micMsg = 'マイクを使用できます。'; render(); })
    .catch(function (err) { S.micOk = false; S.micMsg = micErrorMsg(err); render(); });
}

function startRec() {
  if (!SR) { S.answered = true; S.error = 'このブラウザは音声認識に対応していません（Google Chromeを推奨）。下の欄に文字で回答を入力してください。'; return render(); }
  stopSpeak();
  S.transcript = ''; S.stats = null; S.secs = 0; S.answered = false; S.error = '';
  ensureMic().then(beginRec).catch(function (err) { S.answered = true; S.micOk = false; S.error = micErrorMsg(err); render(); });
}

function beginRec() {
  finalText = ''; interimText = ''; pauses = []; stopping = false; finalized = false; lastEvt = Date.now();
  rec = new SR();
  rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = function (e) {
    var now = Date.now();
    if ((finalText || interimText) && now - lastEvt > 3000) pauses.push((now - lastEvt) / 1000);
    lastEvt = now; interimText = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interimText += e.results[i][0].transcript;
    }
    S.transcript = finalText + interimText;
    var live = $('live'); if (live) { live.textContent = S.transcript || '（話し始めると、ここに文字が表示されます）'; live.scrollTop = live.scrollHeight; }
  };
  rec.onerror = function (e) {
    var msg = '';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = micErrorMsg({ name: 'NotAllowedError' });
    else if (e.error === 'audio-capture') msg = micErrorMsg({ name: 'NotFoundError' });
    else if (e.error === 'network') msg = '音声認識サーバーに接続できません。インターネット接続を確認してください（Chromeの音声認識はオンラインで動作します）。';
    if (msg) { S.error = msg; stopping = true; finalize(); }
  };
  rec.onend = function () {
    if (S.recording && !stopping) { try { rec.start(); } catch (e) {} }
    else if (stopping) { finalize(); }
  };
  try { rec.start(); } catch (e) {}
  S.recording = true;
  clearInterval(recTimer);
  recTimer = setInterval(function () { S.secs++; var t = $('timer'); if (t) t.textContent = mmss(S.secs); }, 1000);
  render();
}

function stopRec() {
  if (!S.recording) return;
  stopping = true; S.recording = false; S.finalizing = true;
  clearInterval(recTimer);
  try { rec.stop(); } catch (e) {}
  finTimer = setTimeout(finalize, 1500);
  render();
}

function finalize() {
  if (finalized) return;
  finalized = true;
  clearTimeout(finTimer); clearInterval(recTimer);
  S.recording = false; S.finalizing = false; stopping = false;
  var longest = pauses.reduce(function (a, b) { return Math.max(a, b); }, 0);
  S.transcript = (finalText + interimText).trim();
  S.stats = { secs: S.secs, pauses: pauses.length, longestPause: Math.round(longest * 10) / 10 };
  S.answered = true;
  if (S.screen === 'question') render();
}

function abortRec() {
  if (S.recording || S.finalizing) { stopping = true; finalized = true; try { rec.stop(); } catch (e) {} }
  clearInterval(recTimer); clearTimeout(finTimer);
  S.recording = false; S.finalizing = false;
}

/* ================= アクション ================= */
function saveLogin() {
  S.error = '';
  if (!S.userName.trim() || !S.token.trim()) { S.error = '利用者名と合言葉を入力してください。'; return render(); }
  S.userName = S.userName.trim(); S.token = S.token.trim();
  busy('接続を確認しています…');
  api('status').then(function (st) {
    store('it_user', S.userName); store('it_token', S.token);
    S.status = st; S.loginOpen = false; busy(''); render();
  }).catch(function (e) { busy(''); S.error = e.message; S.loginOpen = true; render(); });
}

function startSession() {
  var cats = CAT_ORDER.filter(function (k) { return S.cats[k] && catAvailable(k); });
  if (!cats.length) { S.error = '質問のジャンルを1つ以上選んでください。'; return render(); }
  S.error = '';
  busy('質問を生成しています…（10〜20秒ほどかかります）');
  api('generateQuestions', {
    skillText: maskText(S.skillText), projectText: maskText(S.projectText), prepText: maskText(S.prepText), cats: cats, level: S.level
  }).then(function (qs) {
    S.questions = qs; S.idx = 0; S.results = []; S.transcript = ''; S.stats = null; S.answered = false; S.recording = false; S.screen = 'question';
    S.saveMsg = ''; S.saved = false; S.saving = false; S.sessionId = 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); S.finishedAt = null;
    busy(''); render(); resetScroll(); onQuestionShown();
  }).catch(function (e) { busy(''); S.error = e.message; render(); });
}

function beginSession() {
  if (S.micOk !== true) { ensureMic().catch(function (err) { S.micOk = false; S.micMsg = micErrorMsg(err); }); }
  startSession();
}

function evaluate() {
  var q = S.questions[S.idx];
  if (!S.transcript || S.transcript.trim().length < 5) { S.error = '回答が空です。録音するか、文字で回答を入力してください。'; return render(); }
  S.error = '';
  busy('回答を評価しています…（回答例も作成します）');
  var an = analyze(S.transcript);
  var sp = { an: an, stats: S.stats };
  api('evaluateAnswer', {
    question: q.text, intent: q.intent, category: q.category, level: S.level,
    transcript: maskText(S.transcript), skillText: maskText(S.skillText),
    projectText: q.category === 'pj' ? maskText(S.projectText) : '', prepText: q.category === 'prep' ? maskText(S.prepText) : ''
  }).then(function (fb) {
    S.fb = fb;
    S.results[S.idx] = {
      no: q.no, category: q.category, text: q.text, transcript: S.transcript, score: fb.score, axes: fb.axes,
      good: fb.good, improve: fb.improve, model: fb.model, sample: fb.sample, skipped: false,
      fillers: an.s, habits: an.h, speech: sp, pace: paceOf(sp), secs: S.stats ? S.stats.secs : null
    };
    S.screen = 'feedback'; busy(''); render(); resetScroll();
  }).catch(function (e) { busy(''); S.error = e.message; render(); });
}

function skip() {
  var q = S.questions[S.idx];
  S.results[S.idx] = { no: q.no, category: q.category, text: q.text, transcript: '', score: 0, skipped: true };
  goNext();
}

function goNext() {
  S.error = '';
  stopSpeak(); abortRec();
  if (S.idx >= S.questions.length - 1) { return finish(); }
  S.idx++; S.transcript = ''; S.stats = null; S.answered = false; S.fb = null; S.screen = 'question';
  render(); resetScroll(); onQuestionShown();
}

function summary() {
  var valid = S.results.filter(function (r) { return r && !r.skipped; });
  var total = valid.length ? Math.round(valid.reduce(function (a, r) { return a + r.score; }, 0) / valid.length) : 0;
  return { valid: valid, total: total };
}
function allAnswered() {
  return S.questions.length > 0 && S.results.length === S.questions.length && S.results.every(function (r) { return r && !r.skipped; });
}

function finish() {
  S.screen = 'result'; S.finishedAt = new Date(); render(); resetScroll();
  if (allAnswered()) { saveToSheet(true); }
  else { S.saveMsg = 'スキップした質問があるため、自動保存は行っていません。必要な場合は「スプレッドシートに保存」を押してください。'; render(); }
}

/** 結果をスプレッドシートへ保存（全問回答時は自動、それ以外は手動） */
function saveToSheet(auto) {
  if (S.saved || S.saving) return;
  S.saving = true; S.saveMsg = 'スプレッドシートに保存しています…'; render();
  var sm = summary();
  api('saveSession', {
    sessionId: S.sessionId, engineerName: effName(), level: S.level, total: sm.total, saveText: S.saveText,
    results: S.results.map(function (r) {
      return { no: r.no, category: r.category, text: r.text, transcript: r.transcript, score: r.score, axes: r.axes, good: r.good, improve: r.improve, skipped: r.skipped, fillers: r.fillers || 0, pace: r.pace, secs: r.secs };
    })
  }).then(function (r) {
    S.saving = false;
    if (r.saved) { S.saved = true; S.saveMsg = auto ? '全問に回答したため、結果をスプレッドシートへ自動保存しました。' : '結果をスプレッドシートに保存しました。'; }
    else { S.saveMsg = '保存に失敗しました：' + (r.message || ''); }
    if (S.screen === 'result') render();
  }).catch(function (e) { S.saving = false; S.saveMsg = '保存に失敗しました：' + e.message; if (S.screen === 'result') render(); });
}

function resetScroll() { $('main').scrollTop = 0; }

/* ================= 結果の出力（テキスト／Word） ================= */
function p2(n) { return ('0' + n).slice(-2); }
function fmtDate(d) { return d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fileStamp(d) { return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()); }
function download(name, mime, content) {
  var blob = new Blob([content], { type: mime });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function catScores() {
  var by = {};
  summary().valid.forEach(function (r) { (by[r.category] = by[r.category] || []).push(r.score); });
  return Object.keys(by).map(function (k) { return { label: CATS[k] ? CATS[k].label : k, n: by[k].length, avg: Math.round(by[k].reduce(function (a, b) { return a + b; }, 0) / by[k].length) }; });
}
function speechLine(r) {
  var sp = r.speech; if (!sp) return '';
  var t = 'フィラー ' + sp.an.s + '回' + (sp.an.s ? '（' + listCountsPlain(sp.an.strong) + '）' : '') + '／口癖の候補 ' + sp.an.h + '回' + (sp.an.h ? '（' + listCountsPlain(sp.an.habit) + '）' : '');
  if (sp.stats && sp.stats.secs >= 10) t += '／話速 ' + r.pace + '文字/分／3秒以上の間 ' + sp.stats.pauses + '回／回答時間 ' + mmss(sp.stats.secs);
  return t;
}
function axesLine(r) { return AXES.map(function (a) { return a[1] + ' ' + r.axes[a[0]] + '/25'; }).join('　'); }

function reportText() {
  var sm = summary(), d = S.finishedAt || new Date(), L = [];

  L.push('実施日時：' + fmtDate(d));

  L.push('総合スコア：' + sm.total + ' / 100（回答 ' + sm.valid.length + '問 / 全' + S.questions.length + '問）');
  L.push('ジャンル別：' + catScores().map(function (c) { return c.label + ' ' + c.avg; }).join('、'));
  L.push('');
  S.results.forEach(function (r) {
    L.push('────────────────────────────');
    L.push('Q' + r.no + '［' + (CATS[r.category] ? CATS[r.category].label : r.category) + '］' + r.text);
    if (r.skipped) { L.push('（スキップ）'); L.push(''); return; }
    L.push('【回答】' + r.transcript);

    L.push('【良かった点】' + r.good);

function needLogin() { return !S.token || !S.userName || S.loginOpen; }

function genreHtml() {

/** 4軸（各25点）のレーダーチャート */
function radarSvg(axes) {
  var W = 260, H = 210, cx = 130, cy = 104, R = 60, n = AXES.length, vals = AXES.map(function (a) { return axes[a[0]]; });
  function pt(i, r) { var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="評価レーダーチャート（' + AXES.map(function (a, i) { return a[1] + ' ' + vals[i] + '点'; }).join('、') + '）">';
  [0.2, 0.4, 0.6, 0.8, 1].forEach(function (f) {
    var p = []; for (var i = 0; i < n; i++) { var q = pt(i, R * f); p.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
    s += '<polygon points="' + p.join(' ') + '" fill="none" stroke="#D9DEE5" stroke-width="1"/>';
  });
  for (var i = 0; i < n; i++) { var e = pt(i, R); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#D9DEE5" stroke-width="1"/>'; }
  var dp = [], dots = '';
  for (i = 0; i < n; i++) { var d = pt(i, R * Math.max(0, Math.min(25, vals[i])) / 25); dp.push(d[0].toFixed(1) + ',' + d[1].toFixed(1)); dots += '<circle cx="' + d[0].toFixed(1) + '" cy="' + d[1].toFixed(1) + '" r="3.5" fill="#1F5FBF"/>'; }
  s += '<polygon points="' + dp.join(' ') + '" fill="rgba(31,95,191,.25)" stroke="#1F5FBF" stroke-width="2"/>' + dots;
  var anchors = ['middle', 'start', 'middle', 'end'];
  for (i = 0; i < n; i++) {
    var l = pt(i, R + 14), dy = i === 0 ? -6 : (i === 2 ? 14 : 4);
    s += '<text x="' + l[0].toFixed(1) + '" y="' + (l[1] + dy).toFixed(1) + '" text-anchor="' + anchors[i] + '" font-size="12" fill="#1B2430" font-family="inherit">' + AXES[i][2] + ' <tspan font-weight="700">' + vals[i] + '</tspan></text>';
  }
  return s + '</svg>';
}

function vResult() {

    return { k: a[0], avg: v.length ? v.reduce(function (x, y) { return x + y; }, 0) / v.length : 25 };
  }).sort(function (a, b) { return a.avg - b.avg; });
  var tips = axAvg.slice(0, 2).map(function (a) { return '<div class="tip"><b>' + TIPS[a.k][0] + '（平均 ' + a.avg.toFixed(1) + ' / 25）</b>' + TIPS[a.k][1] + '</div>'; });
  var fTotal = 0, mins = 0;

  if (sm.valid.length && (fTotal >= 5 || (mins > 0 && fTotal / mins >= 3))) {

  } else if (tips.length < 3 && axAvg[2]) {

  }
  var rows = S.results.map(function (r) {
    return '<div class="tbl-row"><span class="small" style="width:22px">' + r.no + '</span><span class="tag">' + esc((CATS[r.category] || {}).label || '') + '</span><span class="tx">' + esc(r.text) + '</span><b style="color:var(--accent-d);font-size:15px">' + (r.skipped ? 'スキップ' : r.score) + '</b></div>';

  var saveCard = '<div class="card"><h2>結果の保存・出力</h2>' +
    (S.saveMsg ? '<div class="' + (S.saved ? 'okmsg' : 'note') + '" role="status">' + esc(S.saveMsg) + '</div>' : '') +

    (S.saved ? '' : '<div class="row-inline"><button class="btn ghost min" data-act="savesheet"' + (S.saving ? ' disabled' : '') + '>スプレッドシートに保存</button></div>') + '</div>';

  var main = '<div class="g2"><div class="col">' +
    '<div class="card"><b style="font-size:15px">総合スコア</b><div class="split"><span class="big-score">' + sm.total + '</span><span class="note">/ 100</span></div><p class="note">回答した' + sm.valid.length + '問の平均です。</p></div>' +
    '<div class="card fill"><h2>ジャンル別スコア</h2>' + (cats || '<p class="note">回答がありません。</p>') + '</div>' + saveCard + '</div>' +
    '<div class="col">' +
    '<div class="card"><h2>次回に向けた重点ポイント</h2>' + (sm.valid.length ? tips.join('') : '<p class="note">回答がありません。</p>') + '</div>' +
    '<div class="card fill"><h2>各質問の結果</h2><div class="scroll" style="max-height:300px">' + rows + '</div></div></div></div>';
  var bar = '<span class="grow"></span><button class="btn ghost" data-act="exptxt"' + (sm.valid.length ? '' : ' disabled') + '>テキストで保存</button><button class="btn ghost" data-act="expdoc"' + (sm.valid.length ? '' : ' disabled') + '>Wordで保存</button>' +
    '<button class="btn ghost" data-act="back">設定に戻る</button><button class="btn" data-act="restart">新しい10問で練習する</button>';
  return { main: main, bar: bar };
}

/* ================= イベント ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (a === 'cat') { S.cats[k] = !S.cats[k]; updateGenres(); }
  else if (a === 'lv') { S.level = k; render(); }
  else if (a === 'pick') { $('file').click(); }
  else if (a === 'pickprep') { $('prepfile').click(); }
  else if (a === 'clearprep') { S.prepText = ''; S.prepInfo = ''; render(); }
  else if (a === 'opt') { S.optOpen = !S.optOpen; render(); }
  else if (a === 'login') { saveLogin(); }
  else if (a === 'relogin') { S.loginOpen = true; render(); }
  else if (a === 'mic') { checkMic(); }
  else if (a === 'vtest') { speak('これまでのご経歴を、直近の案件を中心に教えてください。'); }
  else if (a === 'start' || a === 'restart') { beginSession(); }
  else if (a === 'back') { stopSpeak(); abortRec(); S.screen = 'setup'; S.error = ''; render(); }
  else if (a === 'rec') { startRec(); }
  else if (a === 'stop') { stopRec(); }
  else if (a === 'qvoice') { toggleQVoice(); }
  else if (a === 'speak') { speak(S.questions[S.idx].text); }
  else if (a === 'speaksample') { speak(S.fb.sample); }
  else if (a === 'typeonly') { stopSpeak(); S.answered = true; S.transcript = ''; S.stats = null; render(); var tx = $('tx'); if (tx) tx.focus(); }
  else if (a === 'eval') { evaluate(); }
  else if (a === 'skip') { skip(); }
  else if (a === 'next') { stopSpeak(); goNext(); }
  else if (a === 'savesheet') { saveToSheet(false); }
  else if (a === 'exptxt') { exportText(); }
  else if (a === 'expdoc') { exportWord(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'file' && e.target.files[0]) readSkillExcel(e.target.files[0]);
  if (e.target.id === 'prepfile' && e.target.files.length) readPrepFiles(e.target.files);
  var act = e.target.getAttribute && e.target.getAttribute('data-act');
  if (act === 'mask') { S.mask = e.target.checked; updateSum(); }
  if (act === 'autoRead') { S.autoRead = e.target.checked; }
  if (act === 'autoRec') { S.autoRec = e.target.checked; }
  if (act === 'saveText') { S.saveText = e.target.checked; }
  var sel = e.target.getAttribute && e.target.getAttribute('data-sel');
  if (sel === 'voiceName') { S.voiceName = e.target.value; store('it_voice', S.voiceName || null); }
  if (sel === 'rate') { S.rate = Number(e.target.value) || 1.0; store('it_rate', String(S.rate)); }
});
document.addEventListener('input', function (e) {
  var b = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!b) return;
  S[b] = e.target.value;
  if (b === 'engineerName') S.engineerNameTouched = true;
  if (b === 'projectText') updateGenres();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.target.id === 'un' || e.target.id === 'tk')) saveLogin();
});
document.addEventListener('dragover', function (e) { if (e.target.closest && e.target.closest('#drop')) e.preventDefault(); });
document.addEventListener('drop', function (e) {
  if (e.target.closest && e.target.closest('#drop')) {
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if (f && /\.(xlsx|xls)$/i.test(f.name)) readSkillExcel(f); else { S.error = 'Excelファイル（.xlsx / .xls）を選択してください。'; render(); }
  }
});
window.addEventListener('beforeunload', function () { stopSpeak(); });

/* ================= 起動 ================= */
if ('speechSynthesis' in window) {
  try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = fillVoiceSelect; } catch (e) {}
}
S.userName = load('it_user'); S.token = load('it_token');
S.voiceName = load('it_voice'); S.rate = Number(load('it_rate')) || 1.0;
render();
if (S.token && S.userName && API_OK) {
  api('status').then(function (st) { S.status = st; if (S.screen === 'setup') render(); })
    .catch(function (e) {
      S.error = e.message; if (/合言葉/.test(e.message)) { S.token = ''; store('it_token', null); S.loginOpen = true; }
      if (S.screen === 'setup') render();
    });
}
</script>
</body>
</html>
