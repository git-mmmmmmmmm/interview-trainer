<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面談対策トレーナー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#1B2430;--muted:#55606E;--line:#D9DEE5;--ground:#F4F6F9;--card:#FFFFFF;--accent:#1F5FBF;--accent-d:#174A94;--accent-soft:#E8F0FC;--good:#17663A;--good-bg:#E6F4EC;--warn:#8A4B08;--warn-bg:#FDF1E3;--rec:#B3261E;--track:#DDE3EB}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans JP','Hiragino Sans','Meiryo',system-ui,sans-serif;color:var(--ink);background:var(--ground)}
button{font-family:inherit;cursor:pointer}
textarea,input[type=text]{font-family:inherit;color:var(--ink)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:0 24px;min-height:64px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;margin:0}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.step{font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;background:#E8ECF2;color:#3D4856}
.step.on{background:var(--accent);color:#fff}
main{max-width:1120px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.card h2{font-size:16px;margin:0}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col-main{flex:999 1 520px;min-width:0}
.col-side{flex:1 1 280px;min-width:0}
label.lb{font-size:13px;font-weight:500}
textarea,input[type=text]{width:100%;border:1px solid #B8C0CC;border-radius:8px;padding:12px;font-size:14px;line-height:1.7;background:#fff}
textarea:focus,input[type=text]:focus,button:focus-visible{outline:3px solid #9DBDF0;outline-offset:1px}
.drop{border:2px dashed #9AA7B8;border-radius:10px;padding:20px;text-align:center;background:#FAFBFD;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.has{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.btn{min-height:48px;padding:0 24px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
.btn:disabled{background:#A9B4C4;cursor:not-allowed}
.btn.sub{background:#fff;color:var(--accent-d);border:1px solid var(--accent)}
.btn.rec{background:var(--rec);display:inline-flex;align-items:center;gap:10px}
.btn.big{min-height:56px;border-radius:28px;padding:0 32px;font-size:16px}
.btn.text{background:none;color:var(--muted);text-decoration:underline;min-height:40px;padding:0 8px;font-weight:500}
.btn.full{width:100%;min-height:52px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{min-height:72px;text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:10px;border:1px solid #B8C0CC;background:#fff;color:#3D4856}
.opt b{font-size:15px}.opt span{font-size:12px}
.opt.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:8px;border:1px solid #B8C0CC;background:#fff;font-size:14px;font-weight:700;color:#3D4856}
.seg button.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
.chk input{width:20px;height:20px;margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:4px}.bar>div{height:100%;border-radius:4px;background:var(--accent)}
.bar.t{height:10px;border-radius:5px}.bar.t>div{border-radius:5px}
.bar>div.low{background:#B4540A}
.prog{display:flex;align-items:center;gap:16px}.prog .bar{flex:1}
.qtext{font-size:24px;font-weight:700;line-height:1.6;margin:0}
.center{display:flex;flex-direction:column;align-items:center;gap:14px}
.wave{display:flex;align-items:center;gap:4px;height:48px}
.wave i{display:block;width:5px;border-radius:3px;background:#B8C0CC}
.wave.on i{background:var(--rec);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.tbox{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:84px;font-size:15px;line-height:1.9;width:100%;white-space:pre-wrap}
.fb-good{background:var(--good-bg);border:1px solid #B9DEC8;border-radius:12px;padding:20px}
.fb-warn{background:var(--warn-bg);border:1px solid #F0D2A8;border-radius:12px;padding:20px}
.fb-model{background:var(--accent-soft);border:1px solid #BFD3F2;border-radius:12px;padding:24px}
.fb-good h3{color:var(--good)}.fb-warn h3{color:var(--warn)}.fb-model h3{color:var(--accent-d)}
.fb-good h3,.fb-warn h3,.fb-model h3{font-size:13px;margin:0 0 8px}
.fb-good p,.fb-warn p,.fb-model p{font-size:14px;line-height:1.9;margin:0}
.score{font-size:40px;font-weight:700;color:var(--accent-d);margin-left:auto}
.split{display:flex;align-items:baseline;gap:8px}
.axis{display:flex;flex-direction:column;gap:6px;font-size:13px}.axis>div:first-child{display:flex;justify-content:space-between}
.tbl-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #E6EAF0}
.tbl-row .tx{flex:1;font-size:14px;line-height:1.6;min-width:0}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tips div{background:var(--warn-bg);border-radius:10px;padding:16px;font-size:14px;line-height:1.8}
.tips b{display:block;color:var(--warn);margin-bottom:4px}
.err{background:#FDECEA;border:1px solid #F2B8B5;color:#7A1A14;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.7;margin-bottom:20px}
.ov{position:fixed;inset:0;background:rgba(244,246,249,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10}
.spin{width:44px;height:44px;border:5px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.big-score{font-size:64px;font-weight:700;color:var(--accent-d);line-height:1}
.small{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
@media (max-width:600px){.qtext{font-size:20px}.grid2{grid-template-columns:1fr}}
/* ---- 一画面向けコンパクト調整 ---- */
main{padding:16px 24px}
.card{padding:16px 20px;gap:10px;margin-bottom:14px}
.top{min-height:56px}.steps{padding:8px 0}
.opt{min-height:56px;padding:8px 14px}
.drop.h{flex-direction:row;justify-content:space-between;align-items:center;text-align:left;padding:14px 18px;gap:16px}
.drop.h .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:0;font-size:16px;font-weight:700;color:var(--ink);text-align:left;min-height:32px}
.acc .sum{font-size:12px;font-weight:400;color:var(--muted)}
.opts-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-top:6px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;margin-top:14px}
.qgrid .card{margin-bottom:0}
.qtext{font-size:22px}
.wave{height:36px}
.livebox{min-height:96px;max-height:150px;overflow:auto}
.ax2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.tips1{grid-template-columns:1fr}
.scroll{max-height:260px;overflow:auto}
.big-score{font-size:52px}
@media (max-width:860px){.cols2,.qgrid,.opts-body{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="top">
  <h1>面談対策トレーナー</h1>
  <div class="steps" id="steps"></div>
</div>
<main id="app"></main>
<div id="ov" class="ov" style="display:none"><div class="spin"></div><div id="ovmsg" style="font-weight:700"></div></div>

<script>
/* ================= 定数・状態 ================= */
var CATS = {
  hr:   { label: '人事・自己PR', sub: '自己紹介・長所短所・志望動機' },
  tech: { label: 'テクニカル', sub: '技術選定・設計・トラブル対応' },
  biz:  { label: '業務・コミュニケーション', sub: '報連相・要件確認・進捗管理' },
  proj: { label: '案件・経験', sub: '直近案件の役割・課題・成果' }
};
var LEVELS = [['jr', '若手'], ['mid', '中堅'], ['lead', 'リード']];
var AXES = [['conclusion', '結論ファースト'], ['concreteness', '具体性'], ['depth', '技術・業務の深さ'], ['concise', '簡潔さ']];
var STEPS = [['setup', '1 設定'], ['question', '2 音声で回答'], ['feedback', '3 フィードバック'], ['result', '4 結果']];
var TIPS = {
  conclusion: ['結論を先に話す', '経験や背景から話し始める傾向があります。最初の一文で答えを言い切る練習をしましょう。'],
  concreteness: ['数字と場面を入れる', '規模・期間・改善率などの数値や、具体的な場面があると説得力が上がります。'],
  depth: ['理由まで話す', '「何をしたか」に加えて「なぜそうしたか」「他の選択肢との比較」まで話せると深さが伝わります。'],
  concise: ['90秒にまとめる', '要点を2〜3個に絞り、結論→理由→具体例の順で話しましょう。']
};

var S = {
  screen: 'setup', skillText: '', skillFile: '', skillInfo: '', projectText: '', engineerName: '',
  mask: true, maskWords: '', cats: { hr: true, tech: true, biz: true, proj: true }, level: 'mid',
  questions: [], idx: 0, results: [], transcript: '', answered: false, recording: false, secs: 0,
  fb: null, error: '', saveMsg: '', status: null, optOpen: false, micMsg: ''
};
var rec = null, timer = null;

/* ================= ユーティリティ ================= */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function gs(fn, arg) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(new Error((e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '')));
    })[fn](arg);
  });
}
function busy(msg) { $('ov').style.display = msg ? 'flex' : 'none'; $('ovmsg').textContent = msg || ''; }
function mmss(n) { return ('0' + Math.floor(n / 60)).slice(-2) + ':' + ('0' + (n % 60)).slice(-2); }

/** 個人情報の簡易マスク（Geminiへ送る前にブラウザ側で実行） */
function maskText(t) {
  if (!S.mask) return t;
  var out = String(t);
  S.maskWords.split(/[,、\n]/).map(function (w) { return w.trim(); }).filter(Boolean).forEach(function (w) {
    out = out.split(w).join('○○');
  });
  return out
    .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[メール]')
    .replace(/https?:\/\/[^\s]+/g, '[URL]')
    .replace(/0\d{1,4}[-ー−‐]?\d{1,4}[-ー−‐]?\d{3,4}/g, '[電話]')
    .replace(/〒?\s?\d{3}[-ー−‐]\d{4}/g, '[郵便番号]');
}

/* ================= Excel取り込み ================= */
function readExcel(file) {
  var reader = new FileReader();
  busy('Excelを読み込んでいます…');
  reader.onload = function (e) {
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      var parts = [], rows = 0;
      wb.SheetNames.forEach(function (name) {
        var data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, defval: '' });
        var lines = [];
        data.forEach(function (r) {
          var cells = r.map(function (c) { return String(c).replace(/\s+/g, ' ').trim(); }).filter(Boolean);
          if (cells.length) lines.push(cells.join(' | '));
        });
        if (lines.length) { rows += lines.length; parts.push('■シート: ' + name + '\n' + lines.join('\n')); }
      });
      var text = parts.join('\n\n');
      if (!text) throw new Error('読み取れる内容がありませんでした。');
      S.skillText = text.slice(0, 20000);
      S.skillFile = file.name;
      S.skillInfo = wb.SheetNames.length + 'シート／' + rows + '行を取り込みました' + (text.length > 20000 ? '（長いため先頭20,000文字のみ）' : '');
      S.error = '';
    } catch (err) {
      S.error = 'Excelの読み込みに失敗しました：' + err.message + '（.xlsx / .xls 形式か確認してください）';
    }
    busy('');
    render();
  };
  reader.onerror = function () { busy(''); S.error = 'ファイルを読み込めませんでした。'; render(); };
  reader.readAsArrayBuffer(file);
}

/* ================= 音声認識 ================= */
function micErrorMsg(err) {
  var n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') {
    return 'マイクの使用がブロックされています。アドレスバー左のアイコンから「マイク」を「許可」に変更し、ページを再読み込みしてください。許可できない場合は、文字で回答を入力できます。';
  }
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'マイクが見つかりません。マイクの接続と、Chromeのマイク設定（使用するデバイス）を確認してください。';
  if (n === 'NotReadableError') return 'マイクを使用できません。他のアプリ（Web会議など）がマイクを使用中でないか確認してください。';
  return 'マイクを開始できませんでした。文字で回答を入力することもできます。';
}
function checkMic() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    S.micMsg = 'このブラウザではマイクを利用できません。Google Chromeでお試しください。'; return render();
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
    st.getTracks().forEach(function (t) { t.stop(); });
    S.micMsg = 'マイクを使用できます。'; render();
  }).catch(function (err) { S.micMsg = micErrorMsg(err); render(); });
}
function startRec() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  S.transcript = ''; S.secs = 0; S.answered = false; S.error = '';
  if (!SR) {
    S.answered = true;
    S.error = 'このブラウザは音声認識に対応していません（Google Chromeを推奨）。下の欄に文字で回答を入力してください。';
    render(); return;
  }
  var md = navigator.mediaDevices;
  if (md && md.getUserMedia) {
    // 先にマイク許可を明示的に求め、拒否・未接続の理由を分かりやすく表示する
    md.getUserMedia({ audio: true }).then(function (st) {
      st.getTracks().forEach(function (t) { t.stop(); });
      beginRec(SR);
    }).catch(function (err) { S.answered = true; S.error = micErrorMsg(err); render(); });
  } else { beginRec(SR); }
}
function beginRec(SR) {
  rec = new SR();
  rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
  var finalText = '';
  rec.onresult = function (e) {
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interim += e.results[i][0].transcript;
    }
    S.transcript = finalText + interim;
    var el = $('live'); if (el) { el.textContent = S.transcript || '（話し始めると、ここに文字が表示されます）'; el.scrollTop = el.scrollHeight; }
  };
  rec.onerror = function (e) {
    var msg = '';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = micErrorMsg({ name: 'NotAllowedError' });
    else if (e.error === 'audio-capture') msg = micErrorMsg({ name: 'NotFoundError' });
    else if (e.error === 'network') msg = '音声認識サーバーに接続できません。インターネット接続を確認してください（Chromeの音声認識はオンラインで動作します）。';
    if (msg) { stopRec(); S.error = msg; render(); }
  };
  rec.onend = function () { if (S.recording) { try { rec.start(); } catch (_) {} } };
  try { rec.start(); } catch (_) {}
  S.recording = true;
  timer = setInterval(function () { S.secs++; var t = $('timer'); if (t) t.textContent = mmss(S.secs); }, 1000);
  render();
}
function stopRec() {
  S.recording = false; S.answered = true;
  clearInterval(timer);
  if (rec) { try { rec.stop(); } catch (_) {} }
  render();
}

/* ================= アクション ================= */
function startSession() {
  var cats = Object.keys(S.cats).filter(function (k) { return S.cats[k]; });
  if (!cats.length) { S.error = '質問のジャンルを1つ以上選んでください。'; return render(); }
  S.error = '';
  busy('質問を生成しています…（10〜20秒ほどかかります）');
  gs('generateQuestions', {
    skillText: maskText(S.skillText), projectText: maskText(S.projectText), cats: cats, level: S.level
  }).then(function (qs) {
    S.questions = qs; S.idx = 0; S.results = []; S.transcript = ''; S.answered = false; S.screen = 'question'; S.saveMsg = '';
    busy(''); render(); window.scrollTo(0, 0);
  }).catch(function (e) { busy(''); S.error = e.message; render(); });
}

function evaluate() {
  var q = S.questions[S.idx];
  if (!S.transcript || S.transcript.trim().length < 5) { S.error = '回答が空です。録音するか、文字で回答を入力してください。'; return render(); }
  S.error = '';
  busy('回答を評価しています…');
  gs('evaluateAnswer', {
    question: q.text, intent: q.intent, category: q.category, level: S.level,
    transcript: maskText(S.transcript), skillText: maskText(S.skillText)
  }).then(function (fb) {
    S.fb = fb;
    S.results[S.idx] = { no: q.no, category: q.category, text: q.text, transcript: S.transcript, score: fb.score, axes: fb.axes, good: fb.good, improve: fb.improve, skipped: false };
    S.screen = 'feedback'; busy(''); render(); window.scrollTo(0, 0);
  }).catch(function (e) { busy(''); S.error = e.message; render(); });
}

function skip() {
  var q = S.questions[S.idx];
  S.results[S.idx] = { no: q.no, category: q.category, text: q.text, transcript: '', score: 0, skipped: true };
  goNext();
}

function goNext() {
  S.error = '';
  if (S.recording) stopRec();
  if (S.idx >= S.questions.length - 1) { return finish(); }
  S.idx++; S.transcript = ''; S.answered = false; S.fb = null; S.screen = 'question';
  render(); window.scrollTo(0, 0);
}

function summary() {
  var valid = S.results.filter(function (r) { return r && !r.skipped; });
  var total = valid.length ? Math.round(valid.reduce(function (a, r) { return a + r.score; }, 0) / valid.length) : 0;
  return { valid: valid, total: total };
}

function finish() {
  S.screen = 'result'; S.saveMsg = '履歴を保存しています…'; render(); window.scrollTo(0, 0);
  var sm = summary();
  gs('saveSession', { engineerName: S.engineerName, level: S.level, total: sm.total, results: S.results })
    .then(function (r) { S.saveMsg = r.saved ? '結果を履歴シートに保存しました。' : '履歴の保存に失敗しました：' + (r.message || ''); if (S.screen === 'result') render(); })
    .catch(function (e) { S.saveMsg = '履歴の保存に失敗しました：' + e.message; if (S.screen === 'result') render(); });
}

/* ================= 描画 ================= */
function render() {
  var cur = STEPS.map(function (s) { return s[0]; }).indexOf(S.screen);
  $('steps').innerHTML = STEPS.map(function (s, i) { return '<div class="step' + (i === cur ? ' on' : '') + '">' + s[1] + '</div>'; }).join('');
  var html = '';
  if (S.error) html += '<div class="err" role="alert">' + esc(S.error) + '</div>';
  if (S.status && !S.status.hasKey && S.screen === 'setup') {
    html += '<div class="err" role="alert">GEMINI_API_KEY が未設定です。Apps Script の「プロジェクトの設定 &gt; スクリプト プロパティ」に設定してください。</div>';
  }
  html += ({ setup: vSetup, question: vQuestion, feedback: vFeedback, result: vResult })[S.screen]();
  $('app').innerHTML = html;
}

function vSetup() {
  var catBtns = Object.keys(CATS).map(function (k) {
    return '<button class="opt' + (S.cats[k] ? ' on' : '') + '" data-act="cat" data-k="' + k + '" aria-pressed="' + S.cats[k] + '"><b>' + CATS[k].label + '</b><span>' + CATS[k].sub + '</span></button>';
  }).join('');
  var lvBtns = LEVELS.map(function (l) {
    return '<button class="' + (S.level === l[0] ? 'on' : '') + '" data-act="lv" data-k="' + l[0] + '" aria-pressed="' + (S.level === l[0]) + '">' + l[1] + '</button>';
  }).join('');
  var ready = S.skillText.trim().length >= 30;
  var sum = '案件詳細：' + (S.projectText.trim() ? '入力済み' : '未入力') + '　／　個人情報マスク：' + (S.mask ? 'ON' : 'OFF');

  var drop = '<div class="drop h' + (S.skillFile ? ' has' : '') + '" id="drop">' +
    '<div class="info">' + (S.skillFile
      ? '<b>' + esc(S.skillFile) + '</b><span class="note">' + esc(S.skillInfo) + '</span>'
      : '<b>スキルシートのExcelを選択</b><span class="note">.xlsx / .xls をここにドロップ、または右のボタンで選択（ファイルは外部に保存されません）</span>') + '</div>' +
    '<button class="btn sub" data-act="pick">' + (S.skillFile ? '別のファイルを選ぶ' : 'Excelファイルを選択') + '</button>' +
    '<input type="file" id="file" accept=".xlsx,.xls" style="display:none"></div>';

  var optBody = '';
  if (S.optOpen) {
    optBody = '<div class="opts-body">' +
      '<div><label class="lb" for="pj">案件詳細（提案先の案件内容を貼り付けると、案件に合わせた質問が混ざります）</label>' +
      '<textarea id="pj" rows="5" data-bind="projectText" placeholder="例：ECサイト基盤のリニューアル。Java 17 / Spring Boot / AWS。要件定義後半から参画…">' + esc(S.projectText) + '</textarea></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      '<div><label class="lb" for="nm">エンジニア名（履歴用）</label><input type="text" id="nm" data-bind="engineerName" value="' + esc(S.engineerName) + '" placeholder="例：山田"></div>' +
      '<label class="chk"><input type="checkbox" id="mk"' + (S.mask ? ' checked' : '') + ' data-act="mask"><span>AIに送る前に個人情報を伏せる（メール・電話・URL・郵便番号＋下記の語句）</span></label>' +
      '<div><label class="lb" for="mw">伏せたい語句（氏名・会社名など。読点区切り）</label><input type="text" id="mw" data-bind="maskWords" value="' + esc(S.maskWords) + '" placeholder="例：山田太郎、株式会社○○"></div>' +
      '<p class="small">無料枠のGemini APIでは、送信内容が品質改善に利用される場合があります。</p></div></div>';
  }

  return '<div style="max-width:960px;margin:0 auto">' +
    '<div class="card"><h2>1. スキルシート（Excel）</h2>' + drop + '</div>' +
    '<div class="card"><div class="cols2">' +
      '<div><h2 style="margin-bottom:10px">2. 質問のジャンル（複数選択）</h2><div class="grid2">' + catBtns + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px"><h2>3. 想定レベル</h2><div class="seg">' + lvBtns + '</div>' +
      '<p class="note">10問（毎回ランダム）／音声で回答／1問あたり90秒が目安</p>' +
      '<div><button class="btn sub" style="min-height:40px;padding:0 16px;font-size:14px" data-act="mic">マイクを確認する</button>' +
      (S.micMsg ? '<p class="note" style="margin-top:6px" role="status">' + esc(S.micMsg) + '</p>' : '') + '</div></div>' +
    '</div></div>' +
    '<div class="card"><button class="acc" data-act="opt" aria-expanded="' + S.optOpen + '"><span>オプション設定（任意）　<span class="sum">' + esc(sum) + '</span></span><span aria-hidden="true">' + (S.optOpen ? '▲' : '▼') + '</span></button>' + optBody + '</div>' +
    '<button class="btn full" data-act="start"' + (ready ? '' : ' disabled') + '>' + (ready ? '面談を開始する' : 'Excelを取り込むと開始できます') + '</button></div>';
}

function vQuestion() {
  var q = S.questions[S.idx];
  var bars = '';
  for (var i = 0; i < 24; i++) bars += '<i style="height:' + (10 + (i * 37) % 26) + 'px;animation-delay:' + ((i % 8) * 0.1) + 's"></i>';
  var label = S.recording ? '録音中…　話し終えたら停止してください' : (S.answered ? '回答を確認してください（誤変換は直接修正できます）' : 'マイクボタンを押して回答を始めてください');
  var body = '';
  if (S.recording) {
    body = '<button class="btn rec big" data-act="stop"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>録音を停止</button>' +
      '<div class="small">経過 <span id="timer">' + mmss(S.secs) + '</span> ／ 目安 01:30</div>' +
      '<div class="tbox livebox" id="live" aria-live="polite">' + esc(S.transcript || '（話し始めると、ここに文字が表示されます）') + '</div>';
  } else if (S.answered) {
    body = '<textarea id="tx" rows="5" data-bind="transcript" aria-label="あなたの回答（文字起こし）" placeholder="回答を入力してください">' + esc(S.transcript) + '</textarea>' +
      '<div class="actions" style="width:100%"><button class="btn sub" data-act="rec">録り直す</button><button class="btn" data-act="eval">回答を評価する</button></div>';
  } else {
    body = '<button class="btn big" data-act="rec"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>録音を開始</button>' +
      '<button class="btn text" data-act="typeonly">文字で回答する</button>';
  }
  return '<div style="max-width:1040px;margin:0 auto">' +
    '<div class="prog"><b style="font-size:14px;white-space:nowrap">' + q.no + ' / ' + S.questions.length + ' 問</b><div class="bar"><div style="width:' + (q.no / S.questions.length * 100) + '%"></div></div>' +
    '<button class="btn text" data-act="skip" style="white-space:nowrap">スキップ</button></div>' +
    '<div class="qgrid">' +
    '<div class="card" style="padding:24px;justify-content:center"><div><span class="tag">' + esc((CATS[q.category] || {}).label || '') + '</span></div>' +
    '<p class="qtext">' + esc(q.text) + '</p><p class="note">目安：結論から話し、具体例を1つ入れて、90秒以内にまとめましょう。</p></div>' +
    '<div class="card center"><div class="wave' + (S.recording ? ' on' : '') + '" aria-hidden="true">' + bars + '</div>' +
    '<div style="font-size:14px;font-weight:500;text-align:center">' + label + '</div>' + body + '</div>' +
    '</div></div>';
}

function vFeedback() {
  var q = S.questions[S.idx], fb = S.fb;
  var axes = AXES.map(function (a) {
    return '<div class="axis"><div><span>' + a[1] + '</span><b>' + fb.axes[a[0]] + ' / 5</b></div><div class="bar"><div style="width:' + (fb.axes[a[0]] * 20) + '%"></div></div></div>';
  }).join('');
  return '<div class="row"><div class="col-main" style="flex:1 1 420px">' +
    '<div class="card"><div style="display:flex;gap:12px;align-items:center"><span class="tag">' + esc((CATS[q.category] || {}).label || '') + '</span><span class="note">' + q.no + ' / ' + S.questions.length + ' 問</span></div>' +
    '<div style="font-size:17px;font-weight:700;line-height:1.6">' + esc(q.text) + '</div>' +
    '<div class="small" style="font-weight:700;margin-top:4px">あなたの回答（文字起こし）</div><div class="scroll" style="max-height:130px;font-size:14px;line-height:1.8;white-space:pre-wrap">' + esc(S.transcript) + '</div></div>' +
    '<div class="fb-model"><h3>回答の組み立て例</h3><p>' + esc(fb.model) + '</p></div>' +
    '</div><div class="col-side" style="flex:1 1 380px">' +
    '<div class="card"><div class="split"><b style="font-size:14px">この回答の評価</b><span class="score">' + fb.score + '</span><span class="note">/ 100</span></div><div class="ax2">' + axes + '</div></div>' +
    '<div class="fb-good" style="margin-bottom:14px"><h3>良かった点</h3><p>' + esc(fb.good) + '</p></div>' +
    '<div class="fb-warn" style="margin-bottom:14px"><h3>改善ポイント</h3><p>' + esc(fb.improve) + '</p></div>' +
    '<button class="btn full" data-act="next">' + (S.idx >= S.questions.length - 1 ? '結果を見る' : '次の質問へ') + '</button>' +
    '</div></div>';
}

function vResult() {
  var sm = summary();
  var byCat = {};
  sm.valid.forEach(function (r) { (byCat[r.category] = byCat[r.category] || []).push(r.score); });
  var cats = Object.keys(byCat).map(function (k) {
    var avg = Math.round(byCat[k].reduce(function (a, b) { return a + b; }, 0) / byCat[k].length);
    return '<div class="axis"><div><span>' + (CATS[k] ? CATS[k].label : k) + '（' + byCat[k].length + '問）</span><b>' + avg + '</b></div><div class="bar t"><div class="' + (avg < 65 ? 'low' : '') + '" style="width:' + avg + '%"></div></div></div>';
  }).join('');
  var axAvg = AXES.map(function (a) {
    var v = sm.valid.map(function (r) { return r.axes[a[0]]; });
    return { k: a[0], avg: v.length ? v.reduce(function (x, y) { return x + y; }, 0) / v.length : 5 };
  }).sort(function (a, b) { return a.avg - b.avg; }).slice(0, 3);
  var tips = axAvg.map(function (a) { return '<div><b>' + TIPS[a.k][0] + '（平均 ' + a.avg.toFixed(1) + ' / 5）</b>' + TIPS[a.k][1] + '</div>'; }).join('');
  var rows = S.results.map(function (r) {
    return '<div class="tbl-row"><span class="small" style="width:24px">' + r.no + '</span><span class="tag">' + esc((CATS[r.category] || {}).label || '') + '</span><span class="tx">' + esc(r.text) + '</span><b style="color:var(--accent-d);font-size:15px">' + (r.skipped ? 'スキップ' : r.score) + '</b></div>';
  }).join('');
  return '<div class="row" style="align-items:stretch">' +
    '<div class="card" style="flex:1 1 240px;justify-content:center"><b style="font-size:14px">総合スコア</b><div class="split"><span class="big-score">' + sm.total + '</span><span class="note">/ 100</span></div><p class="note">回答した' + sm.valid.length + '問の平均です。</p></div>' +
    '<div class="card" style="flex:2 1 400px"><b style="font-size:14px">ジャンル別スコア</b>' + (cats || '<p class="note">回答がありません。</p>') + '</div></div>' +
    '<div class="row" style="align-items:stretch">' +
    '<div class="card" style="flex:1 1 320px"><b style="font-size:14px">次回に向けた重点ポイント</b>' + (sm.valid.length ? '<div class="tips tips1">' + tips + '</div>' : '<p class="note">回答がありません。</p>') + '</div>' +
    '<div class="card" style="flex:2 1 420px"><b style="font-size:14px">各質問の結果</b><div class="scroll">' + rows + '</div></div></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="btn" data-act="restart">新しい10問で練習する</button><button class="btn sub" data-act="back">設定に戻る</button><span class="small">' + esc(S.saveMsg) + '</span></div>';
}

/* ================= イベント ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (a === 'cat') { S.cats[k] = !S.cats[k]; render(); }
  else if (a === 'lv') { S.level = k; render(); }
  else if (a === 'pick') { $('file').click(); }
  else if (a === 'opt') { S.optOpen = !S.optOpen; render(); }
  else if (a === 'mic') { checkMic(); }
  else if (a === 'start' || a === 'restart') { startSession(); }
  else if (a === 'back') { S.screen = 'setup'; S.error = ''; render(); }
  else if (a === 'rec') { startRec(); }
  else if (a === 'stop') { stopRec(); }
  else if (a === 'typeonly') { S.answered = true; S.transcript = ''; render(); var tx = $('tx'); if (tx) tx.focus(); }
  else if (a === 'eval') { evaluate(); }
  else if (a === 'skip') { skip(); }
  else if (a === 'next') { goNext(); }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'file' && e.target.files[0]) readExcel(e.target.files[0]);
  if (e.target.getAttribute && e.target.getAttribute('data-act') === 'mask') S.mask = e.target.checked;
});
document.addEventListener('input', function (e) {
  var b = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (b) { S[b] = e.target.value; if (b === 'skillText') { var btn = document.querySelector('[data-act=start]'); if (btn) btn.disabled = S.skillText.trim().length < 30; } }
});
document.addEventListener('dragover', function (e) { if (e.target.closest && e.target.closest('#drop')) e.preventDefault(); });
document.addEventListener('drop', function (e) {
  if (e.target.closest && e.target.closest('#drop')) {
    e.preventDefault();
    var f = e.dataTransfer.files[0];
    if (f && /\.(xlsx|xls)$/i.test(f.name)) readExcel(f); else { S.error = 'Excelファイル（.xlsx / .xls）を選択してください。'; render(); }
  }
});

/* ================= 起動 ================= */
render();
gs('getStatus').then(function (st) { S.status = st; if (S.screen === 'setup') render(); }).catch(function () {});
</script>
</body>
</html>
