<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面談対策トレーナー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --ink:#162033;--muted:#5B6678;--line:#E2E7EE;--ground:#F2F5FA;--card:#fff;
  --brand:#1F5FBF;--brand-d:#143E80;--brand-soft:#E8F0FC;
  --green:#17794A;--green-soft:#E6F4EC;--orange:#B4540A;--orange-soft:#FDF1E3;
  --purple:#6B46C1;--purple-soft:#F0EBFB;--teal:#0E7C66;--teal-soft:#E3F5F0;--red:#B3261E;--red-soft:#FDECEA;
  --ax1:#1F5FBF;--ax2:#0E8A6B;--ax3:#7A4FD6;--ax4:#E08A1E;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@supports (height:100dvh){body{height:100dvh}}
body{display:flex;flex-direction:column;overflow:hidden;font-family:'Noto Sans JP','Hiragino Sans','Meiryo',system-ui,sans-serif;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
button,select{font-family:inherit}
button{cursor:pointer}
textarea,input[type=text],input[type=password],select{font-family:inherit;color:var(--ink);width:100%;border:1px solid #B8C0CC;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;background:#fff;transition:border-color .15s,box-shadow .15s}
select{padding:8px 10px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,191,.2)}
button:focus-visible{outline:3px solid #9DBDF0;outline-offset:2px}

/* ===== 骨格 ===== */
.top{flex:none;background:linear-gradient(120deg,#0F2E5C 0%,#1F5FBF 62%,#3B82E0 100%);color:#fff;padding:0 24px;min-height:60px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.brand h1{font-size:17px;margin:0;letter-spacing:.02em}
.brand small{display:block;font-size:11px;opacity:.8;font-weight:400}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);transition:background .25s,color .25s}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:rgba(255,255,255,.2)}
.step.on{background:#fff;color:var(--brand-d)}
.step.on i{background:var(--brand);color:#fff}
.step.done{background:rgba(255,255,255,.22);color:#fff}
.step.done i{background:#58D6A0;color:#0B3B27}
#sbar{flex:none;background:#fff;border-bottom:1px solid var(--line);padding:7px 24px}
#sbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:28px}
.sb-l,.sb-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sb-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.sb-item svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#EEF2F7;color:#3D4856}
.chip.rec{background:var(--red-soft);color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA7B8;display:inline-block}
.dot.ok{background:#1FA463}.dot.ng{background:#D14343}.dot.rec{background:#D14343;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#main{flex:1;min-height:0;overflow:auto;padding:18px 24px 24px;scroll-behavior:smooth}
.wrap{max-width:1040px;margin:0 auto}
.wrap.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.wrap.enter>*:nth-child(2){animation-delay:.05s}.wrap.enter>*:nth-child(3){animation-delay:.1s}.wrap.enter>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#bar{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 24px;box-shadow:0 -4px 16px rgba(16,24,40,.04)}
#bar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:48px}
.grow{flex:1;min-width:0}

/* ===== レイアウト／カード ===== */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col>.card.fill{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:15px;margin:0}
.ch{display:flex;align-items:center;gap:10px}
.ch h2{margin:0}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.ic svg{width:17px;height:17px}
.ic.green{background:var(--green-soft);color:var(--green)}.ic.orange{background:var(--orange-soft);color:var(--orange)}
.ic.purple{background:var(--purple-soft);color:var(--purple)}.ic.teal{background:var(--teal-soft);color:var(--teal)}.ic.red{background:var(--red-soft);color:var(--red)}
.card.a-green{border-top:3px solid #1FA463}.card.a-orange{border-top:3px solid #E08A1E}.card.a-purple{border-top:3px solid #7A4FD6}.card.a-blue{border-top:3px solid var(--brand)}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.lb{font-size:13px;font-weight:600}
.tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-d);white-space:nowrap}

/* ===== ボタン ===== */
.btn{min-height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:0 2px 0 rgba(15,46,92,.25);transition:transform .12s,box-shadow .12s,background .15s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 4px 10px rgba(31,95,191,.28)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{background:#A9B4C4;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px}
.btn.ghost{background:#fff;color:var(--brand-d);border:1px solid #9DBDF0;box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--brand-soft);box-shadow:none}
.btn.ghost:disabled{background:#F1F3F6;color:#8A94A3;border-color:#C5CCD6}
.btn.rec{background:var(--red);box-shadow:0 2px 0 rgba(120,20,15,.3)}
.btn.rec.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}70%{box-shadow:0 0 0 12px rgba(179,38,30,0)}100%{box-shadow:0 0 0 0 rgba(179,38,30,0)}}
.btn.min{min-height:38px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.plain{background:none;color:var(--muted);font-weight:500;padding:0 10px;text-decoration:underline;box-shadow:none}
.btn.plain:hover:not(:disabled){background:none;box-shadow:none;transform:none;color:var(--ink)}
.opt{position:relative;min-height:64px;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px;border:1px solid #CBD3DE;background:#fff;color:#3D4856;transition:border-color .15s,background .15s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
.opt.on{border:2px solid var(--brand);background:var(--brand-soft);color:var(--brand-d);padding:9px 13px}
.opt.on::after{content:"✓";position:absolute;right:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
.opt:disabled{opacity:.6;cursor:not-allowed;background:#F4F6F9}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;padding:4px;background:#EEF2F7;border-radius:12px}
.seg button{flex:1;min-width:0;min-height:54px;border-radius:9px;border:0;background:transparent;font-size:13px;font-weight:700;color:#3D4856;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.25;transition:background .15s,color .15s,box-shadow .15s}
.seg button b{font-size:12px;font-weight:500;color:var(--muted)}
.seg button.on b{color:var(--brand)}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(16,24,40,.14)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
.chk input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--brand)}
.drop{border:2px dashed #9AA7B8;border-radius:14px;padding:16px 18px;background:#FAFBFD;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:background .2s,border-color .2s}
.drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:#1FA463;background:var(--green-soft)}
.drop .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;padding:0;font-size:15px;font-weight:700;color:var(--ink);text-align:left;min-height:30px}
.acc .sum{font-size:12px;font-weight:400;color:var(--muted)}
.acc .chev{transition:transform .2s}
.acc[aria-expanded=true] .chev{transform:rotate(180deg)}
.opts-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-top:8px;animation:rise .3s both}
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}
.row-inline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub-box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#FAFBFD}
.ready{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 質問画面 ===== */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prog b{font-size:14px;white-space:nowrap}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:10px;border-radius:5px;background:#DDE3EB;transition:background .3s}
.dots i.hi{background:#1FA463}.dots i.mid{background:var(--brand)}.dots i.lo{background:#E08A1E}
.dots i.skip{background:repeating-linear-gradient(45deg,#C5CCD6,#C5CCD6 4px,#E2E7EE 4px,#E2E7EE 8px)}
.dots i.cur{background:#fff;box-shadow:inset 0 0 0 2px var(--brand);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px var(--brand),0 0 0 4px rgba(31,95,191,.18)}}
.qcard{padding:26px 28px;justify-content:center;gap:14px;background:linear-gradient(180deg,#fff 0%,#F6F9FF 100%)}
.qtext{font-size:22px;font-weight:700;line-height:1.65;margin:0;position:relative;padding-left:16px}
.qtext::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;border-radius:2px;background:linear-gradient(var(--brand),#58A0F0)}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flow span{font-size:12px;font-weight:700;color:var(--brand-d);background:var(--brand-soft);border-radius:999px;padding:4px 12px}
.flow em{font-style:normal;color:#9AA7B8;font-size:12px}
.center{align-items:center;justify-content:center;text-align:center}
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:40px}
.wave i{display:block;width:5px;border-radius:3px;background:#B8C0CC}
.wave.on i{background:var(--red);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.tbox{background:#F7F9FC;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:100px;max-height:180px;overflow:auto;font-size:15px;line-height:1.9;width:100%;white-space:pre-wrap;text-align:left}
.vt{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--brand);background:#fff;color:var(--brand-d);font-size:13px;font-weight:700;transition:background .15s}
.vt svg{width:16px;height:16px}
.vt:hover:not(:disabled){background:var(--brand-soft)}
.vt[aria-pressed=false]{border-color:#B8C0CC;color:var(--muted);background:#F4F6F9}
.vt:disabled{opacity:.5;cursor:not-allowed}
.tg{width:100%;max-width:420px}
.tgbar{position:relative;height:12px;border-radius:6px;background:#E6EBF2;overflow:hidden}
.tgbar .zone{position:absolute;left:33.333%;width:33.333%;top:0;bottom:0;background:rgba(31,163,99,.22);border-left:1px dashed #1FA463;border-right:1px dashed #1FA463}
.tgbar .tfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:#7DA7E8;transition:width .6s linear,background .3s}
.tfill.ideal{background:#1FA463!important}.tfill.long{background:#E08A1E!important}.tfill.over{background:#D14343!important}
.tgscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.tgscale b{color:#17794A}

/* ===== 評価・結果 ===== */
.evalbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rfg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rt b{font-size:32px;line-height:1;color:var(--ink)}
.ring .rt span{font-size:11px;color:var(--muted)}
.bandbadge{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px}
.radar{flex:0 1 310px;max-width:100%}
.axes{flex:1;min-width:170px;display:flex;flex-direction:column;gap:11px}
.axis{display:flex;flex-direction:column;gap:5px;font-size:13px}
.axis>div:first-child{display:flex;justify-content:space-between;align-items:center}
.axis .nm{display:flex;align-items:center;gap:7px}
.axis .nm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{height:9px;background:#E6EBF2;border-radius:5px;overflow:hidden}
.bar>div{height:100%;border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sumline{font-size:12px;color:var(--muted);background:#F4F6F9;border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums}
.sec h3{font-size:13px;margin:0 0 4px;display:flex;align-items:center;gap:6px}
.sec p{font-size:14px;line-height:1.85;margin:0}
.sec.good h3{color:var(--green)}.sec.warn h3{color:var(--orange)}
.sec+.sec{border-top:1px dashed var(--line);padding-top:12px}
.model{background:linear-gradient(180deg,#F3F8FF,#E8F0FC);border-color:#BFD3F2}
.model p{font-size:14px;line-height:1.9;margin:0}
.scroll{overflow:auto;max-height:230px}
.tbl-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E6EAF0}
.tbl-row .tx{flex:1;font-size:14px;line-height:1.6;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.5;color:var(--muted)}
.stat b{font-size:17px;display:block;color:var(--ink)}
.stat em{font-style:normal;font-weight:700;display:block}
.stat.ideal{background:var(--green-soft);border-color:#B9DEC8}.stat.ideal em{color:var(--green)}
.stat.long,.stat.over{background:var(--orange-soft);border-color:#F0D2A8}.stat.long em,.stat.over em{color:var(--orange)}
.stat.short{background:var(--brand-soft);border-color:#BFD3F2}.stat.short em{color:var(--brand-d)}
.tip{background:var(--orange-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7}
.tip b{display:block;color:var(--orange);margin-bottom:2px}
mark.m1{background:#FFD9B0;color:#5A2E00;border-radius:3px;padding:0 2px;border-bottom:2px solid #B4540A}
mark.m2{background:#FFF0B3;color:#5A4600;border-radius:3px;padding:0 2px;border-bottom:2px dashed #B48A00}
.err{background:var(--red-soft);border:1px solid #F2B8B5;color:#7A1A14;border-radius:12px;padding:12px 16px;font-size:14px;line-height:1.7;margin-bottom:16px}
.okmsg{background:var(--green-soft);border:1px solid #B9DEC8;color:var(--green);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7}

/* ===== オーバーレイ／ダイアログ／トースト ===== */
.ov{position:fixed;inset:0;background:rgba(242,245,250,.9);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
.spin{width:46px;height:46px;border:5px solid #DDE3EB;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ovhint{font-size:13px;color:var(--muted);max-width:420px;text-align:center;min-height:20px}
dialog{border:0;border-radius:20px;padding:0;width:min(960px,94vw);max-height:88vh;box-shadow:0 24px 60px rgba(16,24,40,.35);color:var(--ink)}
dialog::backdrop{background:rgba(16,24,40,.5)}
dialog[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.dh{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.dh h3{margin:0;font-size:16px}
.dh .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:0;background:#EEF2F7;font-size:20px;line-height:1;color:var(--muted)}
.dbody{padding:18px 22px 8px;display:flex;flex-direction:column;gap:14px}
.dq{font-size:15px;font-weight:700;line-height:1.7}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.dcol{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#FAFBFD}
.dcol.ex{background:linear-gradient(180deg,#F3F8FF,#E8F0FC);border-color:#BFD3F2}
.dlabel{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.dcol.ex .dlabel{color:var(--brand-d)}
.dtext{font-size:15px;line-height:2;white-space:pre-wrap}
.dfoot{display:flex;gap:10px;justify-content:flex-end;padding:12px 22px 18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#162033;color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

.bsec,.bpri{display:flex;gap:10px;align-items:center}
@media (max-width:900px){
  .g2,.opts-body,.login,.dcols{grid-template-columns:1fr}
  .col>.card.fill{flex:none}
}
@media (max-width:640px){
  .top{padding:8px 12px;gap:6px;min-height:0}
  .brand{gap:8px}.brand .mark{width:28px;height:28px;border-radius:8px}.brand .mark svg{width:16px;height:16px}
  .brand h1{font-size:15px}.brand small{display:none}
  .steps{width:100%;justify-content:space-between;gap:4px;padding:2px 0}
  .step{font-size:12px;padding:4px 10px 4px 4px;gap:6px}
  .step:not(.on){padding:4px}
  .step:not(.on) .sl{display:none}
  #sbar{padding:5px 12px}
  #sbar .in{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-height:26px}
  #sbar .in::-webkit-scrollbar{display:none}
  .sb-l{display:none}
  .sb-r{flex-wrap:nowrap;white-space:nowrap}
  #main{padding:12px 12px 16px}
  .card{padding:16px;border-radius:14px;gap:10px}
  .qcard{padding:18px}
  .qtext{font-size:19px}
  textarea,input[type=text],input[type=password],select{font-size:16px}
  .btn{min-height:50px}
  .btn.min{min-height:44px}
  .drop{flex-direction:column;align-items:stretch}

<script>
/* ================= 設定（接続先は config.js で指定） ================= */

const API_OK = !!API_URL && !/YOUR-DEPLOYMENT-ID/.test(API_URL);

/* ================= 定数・状態 ================= */
const CATS = {

};
const CAT_ORDER = ['hr', 'tech', 'biz', 'proj', 'pj', 'prep'];
const LEVELS = [['l1', 'Lv1', '入門'], ['l2', 'Lv2', '初級'], ['l3', 'Lv3', '中級'], ['l4', 'Lv4', '上級'], ['l5', 'Lv5', 'リード']];
const LEVEL_LABEL = { l1: 'Lv1 入門', l2: 'Lv2 初級', l3: 'Lv3 中級', l4: 'Lv4 上級', l5: 'Lv5 リード' };
const LEVEL_DESC = {
  l1: '未経験〜実務1年目向け。基本用語や担当した作業など、平易な質問を中心に出題します。採点はやや甘めです。',

const AXES = [

];
const STEPS = [['setup', '設定'], ['question', '音声で回答'], ['feedback', 'フィードバック'], ['result', '結果']];
const TIPS = {
  conclusion: ['結論を先に話す', '経験や背景から話し始める傾向があります。最初の一文で答えを言い切る練習をしましょう。'],

  depth: ['理由まで話す', '「何をしたか」に加えて「なぜそうしたか」「他の選択肢との比較」まで話せると深さが伝わります。'],
  concise: ['30〜60秒にまとめる', '要点を2〜3個に絞り、結論→理由→具体例の順で話しましょう。長くなる場合は、具体例を1つに絞ります。']
};
const HINTS = ['結論を先に言い切ると、伝わりやすくなります。', '数字と具体的な場面を1つ入れてみましょう。', '回答は30〜60秒がちょうど良い長さです。', '言い淀みそうなときは、一呼吸おいてから話しましょう。'];

// フィラー判定（「あの」「その」単体は指示語との区別がつかないため対象外）
const RE_STRONG = '(?:えーっと|えーと|えっと|ええと|えー|あのー|あのう|そのー|うーん|んー|あー|まー|まあ)';
const RE_HABIT = '(?:なんか|ちょっと|やっぱり|やっぱ|一応|とりあえず|なんていうか|何というか|みたいな)';

const ICONS = {
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',

  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  chart: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',

  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',

  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  speaker: '<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>',
  speakerOff: '<path d="M11 5L6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  chev: '<path d="M6 9l6 6 6-6"/>'
};
const svg = (n, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + ICONS[n] + '</svg>';
const ic = (n, tone) => '<span class="ic ' + (tone || '') + '">' + svg(n) + '</span>';
const ch = (n, tone, title, right) => '<div class="ch">' + ic(n, tone) + '<h2>' + title + '</h2>' + (right ? '<span style="margin-left:auto">' + right + '</span>' : '') + '</div>';

const S = {
  screen: 'setup', skillText: '', skillFile: '', skillInfo: '', projectText: '', prepText: '', prepInfo: '',
  engineerName: '', engineerNameTouched: false, saveText: true,
  userName: '', token: '', loginOpen: false,
  mask: true, maskWords: '', cats: { hr: true, tech: true, biz: true, proj: true, pj: false, prep: false }, level: 'l3',
  autoRead: true, autoRec: true, qVoice: true, voiceName: '', rate: 1.0,
  questions: [], idx: 0, results: [], transcript: '', stats: null, answered: false, recording: false, finalizing: false, secs: 0,
  fb: null, error: '', saveMsg: '', saved: false, saving: false, sessionId: '', finishedAt: null,
  status: null, apiOld: false, conn: 'unknown', optOpen: false, micOk: null, micMsg: ''
};

/* ================= ユーティリティ ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mmss = n => ('0' + Math.floor(n / 60)).slice(-2) + ':' + ('0' + (n % 60)).slice(-2);
const store = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const load = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const effName = () => (S.engineerNameTouched ? S.engineerName : S.userName).trim() || S.userName;
const hasProject = () => S.projectText.trim().length >= 20;
const hasPrep = () => S.prepText.trim().length >= 30;
const catAvailable = k => { const n = CATS[k].need; return !n || (n === 'project' ? hasProject() : hasPrep()); };
const answeredN = () => S.results.filter(r => r && !r.skipped).length;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let hintTimer = null;
function busy(msg, hint) {
  $('ov').style.display = msg ? 'flex' : 'none';
  $('ovmsg').textContent = msg || '';
  clearInterval(hintTimer);
  const h = $('ovhint');
  if (msg && hint) {
    let i = Math.floor(Math.random() * HINTS.length);
    h.textContent = 'ヒント：' + HINTS[i];
    hintTimer = setInterval(() => { i = (i + 1) % HINTS.length; h.textContent = 'ヒント：' + HINTS[i]; }, 3200);
  } else h.textContent = '';
}
let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/** GAS API 呼び出し（text/plain で送ることで CORS のプリフライトを避ける） */
function setConn(v) { if (S.conn !== v) { S.conn = v; renderStatus(); } }
function api(action, payload) {
  if (!API_OK) return Promise.reject(new Error('接続先が未設定です。config.js の API_URL に、GASの「/exec」のURLを設定してください。'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: S.token, user: S.userName, payload: payload || {} })
  }).then(r => r.text()).then(txt => {
    let j;
    try { j = JSON.parse(txt); } catch (e) { setConn('error'); throw new Error('サーバーの応答を解釈できません。GASのデプロイが「アクセスできるユーザー：全員」になっているか確認してください。'); }
    setConn('ok');
    if (!j.ok) throw new Error(j.error || 'サーバーでエラーが発生しました。');
    return j.data;
  }, () => { setConn('error'); throw new Error('サーバーに接続できません。ネットワークとconfig.jsのAPI_URLを確認してください。'); });
}

/** 個人情報の簡易マスク（Geminiへ送る前にブラウザ側で実行） */
function maskText(t) {
  if (!S.mask) return t;
  let out = String(t);
  S.maskWords.split(/[,、\n]/).map(w => w.trim()).filter(Boolean).forEach(w => { out = out.split(w).join('○○'); });
  return out
    .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[メール]')
    .replace(/https?:\/\/[^\s]+/g, '[URL]')
    .replace(/0\d{1,4}[-ー−‐]?\d{1,4}[-ー−‐]?\d{3,4}/g, '[電話]')
    .replace(/〒?\s?\d{3}[-ー−‐]\d{4}/g, '[郵便番号]');
}

/* ================= 採点まわり（点数・時間の判定） ================= */
const sumAxes = a => AXES.reduce((s, x) => s + (a[x.k] || 0), 0);
function normFb(fb) {
  // 点数の単一の情報源：4軸（各0〜25）の合計。サーバーの値とずれても必ず合計に揃える
  const axes = {};
  AXES.forEach(x => { axes[x.k] = Math.max(0, Math.min(25, Math.round(Number(fb.axes && fb.axes[x.k]) || 0))); });
  return Object.assign({}, fb, { axes, score: sumAxes(axes) });
}
function band(score) {
  if (score >= 85) return { label: 'とても良い', color: '#17794A', bg: '#E6F4EC' };
  if (score >= 70) return { label: '良い', color: '#1F5FBF', bg: '#E8F0FC' };
  if (score >= 55) return { label: '標準', color: '#8A5A00', bg: '#FFF3D6' };
  if (score >= 40) return { label: 'もう一歩', color: '#B4540A', bg: '#FDF1E3' };
  return { label: '要練習', color: '#B3261E', bg: '#FDECEA' };
}
function zoneOf(secs) {
  if (!secs || secs <= 0) return { cls: 'idle', label: '—' };
  if (secs < 30) return { cls: 'short', label: '短め' };
  if (secs <= 60) return { cls: 'ideal', label: 'ちょうど良い' };
  if (secs <= 75) return { cls: 'long', label: 'やや長め' };
  return { cls: 'over', label: '長すぎ' };
}

/* ================= フィラー分析 ================= */
function countMatches(text, reSrc) {
  const re = new RegExp(reSrc, 'g'); let m, n = 0; const map = {};
  while ((m = re.exec(text))) { map[m[0]] = (map[m[0]] || 0) + 1; n++; }
  return { map, n };
}
function analyze(text) {
  const s = countMatches(text, RE_STRONG), h = countMatches(text, RE_HABIT);
  return { strong: s.map, s: s.n, habit: h.map, h: h.n, chars: String(text).replace(/[\s、。，．,.!?！？]/g, '').length };
}
function highlight(text) {
  const re = new RegExp('(' + RE_STRONG + ')|(' + RE_HABIT + ')', 'g'); let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index)) + '<mark class="' + (m[1] ? 'm1' : 'm2') + '">' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
const listCounts = map => Object.keys(map).map(k => esc(k) + ' ×' + map[k]).join('　');
const listCountsPlain = map => Object.keys(map).map(k => k + '×' + map[k]).join('、');
const paceOf = sp => (sp && sp.stats && sp.stats.secs >= 10) ? Math.round(sp.an.chars / (sp.stats.secs / 60)) : null;

/* ================= ファイル取り込み（Excel / Word / PDF） ================= */
const loadedLibs = {};
function loadScript(url) {
  return new Promise((resolve, reject) => {
    if (loadedLibs[url]) return resolve();
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => { loadedLibs[url] = true; resolve(); };
    s.onerror = () => reject(new Error('読み込み用のライブラリを取得できませんでした。ネットワークを確認してください。'));
    document.head.appendChild(s);
  });
}
const readBuffer = file => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = e => resolve(e.target.result);
  r.onerror = () => reject(new Error('ファイルを読み込めませんでした。'));
  r.readAsArrayBuffer(file);
});
function excelToText(buf) {
  const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
  const parts = []; let rows = 0;
  wb.SheetNames.forEach(name => {
    const data = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, defval: '' });
    const lines = [];
    data.forEach(r => {
      const cells = r.map(c => String(c).replace(/\s+/g, ' ').trim()).filter(Boolean);
      if (cells.length) lines.push(cells.join(' | '));
    });
    if (lines.length) { rows += lines.length; parts.push('■シート: ' + name + '\n' + lines.join('\n')); }
  });
  return { text: parts.join('\n\n'), sheets: wb.SheetNames.length, rows };
}
function extractText(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  return readBuffer(file).then(buf => {
    if (ext === 'xlsx' || ext === 'xls') return excelToText(buf).text;
    if (ext === 'docx') return loadScript(MAMMOTH_URL).then(() => window.mammoth.extractRawText({ arrayBuffer: buf })).then(r => r.value);
    if (ext === 'pdf') {
      return loadScript(PDFJS_URL).then(() => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      }).then(pdf => {
        const n = Math.min(pdf.numPages, 40), jobs = [];
        for (let i = 1; i <= n; i++) jobs.push(pdf.getPage(i).then(pg => pg.getTextContent()).then(tc => tc.items.map(it => it.str).join(' ')));
        return Promise.all(jobs).then(a => a.join('\n'));
      });
    }
    throw new Error('対応していない形式です（.xlsx / .xls / .docx / .pdf）');
  });
}
function readSkillExcel(file) {
  busy('Excelを読み込んでいます…');
  readBuffer(file).then(buf => {
    const r = excelToText(buf);
    if (!r.text) throw new Error('読み取れる内容がありませんでした。');
    S.skillText = r.text.slice(0, 20000);
    S.skillFile = file.name;
    S.skillInfo = r.sheets + 'シート／' + r.rows + '行を取り込みました' + (r.text.length > 20000 ? '（長いため先頭20,000文字のみ）' : '');
    S.error = '';
  }).catch(err => { S.error = 'Excelの読み込みに失敗しました：' + err.message + '（.xlsx / .xls 形式か確認してください）'; })
    .then(() => { busy(''); render(); });
}
function readPrepFiles(files) {
  const list = Array.from(files);
  if (!list.length) return;
  busy('面談対策資料を読み込んでいます…');
  const parts = [], names = [], errors = [];
  list.reduce((p, f) => p.then(() => extractText(f).then(t => {
    t = String(t || '').trim();
    if (t.length < 30) throw new Error('文字を抽出できませんでした（画像のPDFなどには未対応）');
    parts.push('■資料: ' + f.name + '\n' + t); names.push(f.name);
  }).catch(e => { errors.push(f.name + '：' + e.message); })), Promise.resolve()).then(() => {
    if (parts.length) {
      const all = parts.join('\n\n');
      S.prepText = all.slice(0, 20000);
      S.prepInfo = names.join('、') + '（' + Math.min(all.length, 20000).toLocaleString() + '文字' + (all.length > 20000 ? '、長いため先頭のみ' : '') + '）';
    }
    S.error = errors.length ? '取り込めなかった資料：' + errors.join(' ／ ') : '';
    busy(''); render();
  });
}

/* ================= 質問の読み上げ（音声選択・速度調整） ================= */
let speakTok = 0;
const jaVoices = () => { try { return window.speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)); } catch (e) { return []; } };
function voiceScore(v) {
  const n = v.name || ''; let s = 0;
  if (/natural/i.test(n)) s += 100;
  if (/online/i.test(n)) s += 80;
  if (/google/i.test(n)) s += 60;
  if (/nanami|keita|aoi|mayu|shiori|daichi/i.test(n)) s += 50;
  if (/kyoko|otoya|siri/i.test(n)) s += 30;
  if (/microsoft/i.test(n)) s += 20;
  if (!v.localService) s += 10;
  return s;
}
function pickVoice() {
  const vs = jaVoices();
  if (S.voiceName) { const f = vs.find(v => v.name === S.voiceName); if (f) return f; }
  let best = null, bs = -1;
  vs.forEach(v => { const s = voiceScore(v); if (s > bs) { bs = s; best = v; } });
  return best;
}
function fillVoiceSelect() {
  const sel = $('vsel'); if (!sel) return;
  const vs = jaVoices().slice().sort((a, b) => voiceScore(b) - voiceScore(a));
  sel.innerHTML = '<option value="">自動（おすすめの声を選択）</option>' + vs.map(v => '<option value="' + esc(v.name) + '"' + (v.name === S.voiceName ? ' selected' : '') + '>' + esc(v.name) + '</option>').join('');
}
function stopSpeak() { speakTok++; try { window.speechSynthesis.cancel(); } catch (e) {} }
function speak(text, done) {
  if (!('speechSynthesis' in window)) { if (done) done(); return; }
  stopSpeak();
  const tok = speakTok;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = S.rate || 1.0; u.pitch = 1.0;
  const v = pickVoice(); if (v) u.voice = v;
  u.onend = () => { if (tok === speakTok && done) done(); };
  u.onerror = () => { if (tok === speakTok && done) done(); };
  window.speechSynthesis.speak(u);
}
function onQuestionShown() {
  const q = S.questions[S.idx];
  S.qVoice = S.autoRead;
  const tok = ++speakTok;
  const after = () => {
    if (tok !== speakTok || S.screen !== 'question' || S.answered || S.recording) return;
    if (S.autoRec) startRec();
  };
  if (S.qVoice) { render(); setTimeout(() => { if (tok === speakTok) speak(q.text, after); }, 350); }
  else after();
}
function toggleQVoice() {
  if (S.recording || S.finalizing) return;
  const q = S.questions[S.idx];
  S.qVoice = !S.qVoice;
  if (!S.qVoice) { stopSpeak(); render(); if (S.autoRec && !S.answered) startRec(); }
  else {
    render();
    const tok = ++speakTok;
    speak(q.text, () => { if (tok === speakTok && S.autoRec && !S.answered && !S.recording && S.screen === 'question') startRec(); });
  }
}

/* ================= マイク・音声認識 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recTimer = null, finTimer = null, finalText = '', interimText = '', lastEvt = 0, pauses = [], stopping = false, finalized = true;

function micErrorMsg(err) {
  const n = err && err.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'マイクの使用がブロックされています。アドレスバー左のアイコンから「マイク」を「許可」に変更し、ページを再読み込みしてください。';
  if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'マイクが見つかりません。接続と、Chromeのマイク設定（使用するデバイス）を確認してください。';
  if (n === 'NotReadableError') return 'マイクを使用できません。他のアプリ（Web会議など）がマイクを使用中でないか確認してください。';
  if (n === 'Unsupported') return 'このブラウザではマイクを利用できません。Google Chromeをお使いください。';
  return 'マイクを開始できませんでした。文字で回答を入力することもできます。';
}
function ensureMic() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return Promise.reject({ name: 'Unsupported' });
  return navigator.mediaDevices.getUserMedia({ audio: true }).then(st => { st.getTracks().forEach(t => t.stop()); S.micOk = true; renderStatus(); updateSetupBar(); });
}
function checkMic() {
  ensureMic().then(() => { S.micMsg = 'マイクを使用できます。'; updateMic(); })
    .catch(err => { S.micOk = false; S.micMsg = micErrorMsg(err); updateMic(); });
}
function startRec() {
  if (!SR) { S.answered = true; S.error = 'この端末・ブラウザは音声認識に対応していません（Google Chromeを推奨。iPhoneは非対応）。下の欄に文字で回答してください（スマホのキーボードの音声入力も使えます）。'; return render(); }
  stopSpeak();
  S.transcript = ''; S.stats = null; S.secs = 0; S.answered = false; S.error = '';
  ensureMic().then(beginRec).catch(err => { S.answered = true; S.micOk = false; S.error = micErrorMsg(err); render(); });
}
function tickUI() {
  const t = $('timer'); if (t) t.textContent = mmss(S.secs);
  const st = $('stimer'); if (st) st.textContent = mmss(S.secs);
  updateGauge(S.secs);
}
function updateGauge(secs) {
  const f = $('tfill'); if (!f) return;
  const z = zoneOf(secs);
  f.style.width = Math.min(100, secs / 90 * 100) + '%';
  f.className = 'tfill ' + z.cls;
  const l = $('tlabel'); if (l) l.textContent = secs > 0 ? mmss(secs) + '　' + z.label : '目安：30〜60秒';
}
function beginRec() {
  finalText = ''; interimText = ''; pauses = []; stopping = false; finalized = false; lastEvt = Date.now();
  rec = new SR();
  rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    const now = Date.now();
    if ((finalText || interimText) && now - lastEvt > 3000) pauses.push((now - lastEvt) / 1000);
    lastEvt = now; interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript; else interimText += e.results[i][0].transcript;
    }
    S.transcript = finalText + interimText;
    const live = $('live'); if (live) { live.textContent = S.transcript || '（話し始めると、ここに文字が表示されます）'; live.scrollTop = live.scrollHeight; }
  };
  rec.onerror = e => {
    let msg = '';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') msg = micErrorMsg({ name: 'NotAllowedError' });
    else if (e.error === 'audio-capture') msg = micErrorMsg({ name: 'NotFoundError' });
    else if (e.error === 'network') msg = '音声認識サーバーに接続できません。インターネット接続を確認してください（Chromeの音声認識はオンラインで動作します）。';
    if (msg) { S.error = msg; stopping = true; finalize(); }
  };
  rec.onend = () => {
    if (S.recording && !stopping) { try { rec.start(); } catch (e) {} }
    else if (stopping) finalize();
  };
  try { rec.start(); } catch (e) {}
  S.recording = true;
  clearInterval(recTimer);
  recTimer = setInterval(() => { S.secs++; tickUI(); }, 1000);
  render();
}
function stopRec() {
  if (!S.recording) return;
  stopping = true; S.recording = false; S.finalizing = true;
  clearInterval(recTimer);
  try { rec.stop(); } catch (e) {}
  finTimer = setTimeout(finalize, 1500);
  render();
}
function finalize() {
  if (finalized) return;
  finalized = true;
  clearTimeout(finTimer); clearInterval(recTimer);
  S.recording = false; S.finalizing = false; stopping = false;
  const longest = pauses.reduce((a, b) => Math.max(a, b), 0);
  S.transcript = (finalText + interimText).trim();
  S.stats = { secs: S.secs, pauses: pauses.length, longestPause: Math.round(longest * 10) / 10 };
  S.answered = true;
  if (S.screen === 'question') render();
}
function abortRec() {
  if (S.recording || S.finalizing) { stopping = true; finalized = true; try { rec.stop(); } catch (e) {} }
  clearInterval(recTimer); clearTimeout(finTimer);
  S.recording = false; S.finalizing = false;
}

/* ================= アクション ================= */
function checkStatus(st) {
  S.status = st;
  S.apiOld = Number(st && st.apiVersion) !== EXPECT_API_VERSION;
}
function saveLogin() {
  S.error = '';
  if (!S.userName.trim() || !S.token.trim()) { S.error = '利用者名と合言葉を入力してください。'; return render(); }
  S.userName = S.userName.trim(); S.token = S.token.trim();
  busy('接続を確認しています…');
  api('status').then(st => {
    store('it_user', S.userName); store('it_token', S.token);
    checkStatus(st); S.loginOpen = false; busy(''); render();
  }).catch(e => { busy(''); S.error = e.message; S.loginOpen = true; render(); });
}
function startSession() {
  const cats = CAT_ORDER.filter(k => S.cats[k] && catAvailable(k));
  if (!cats.length) { S.error = '質問のジャンルを1つ以上選んでください。'; return render(); }
  S.error = '';
  busy('質問を生成しています…（10〜20秒ほどかかります）', true);
  api('generateQuestions', {
    skillText: maskText(S.skillText), projectText: maskText(S.projectText), prepText: maskText(S.prepText), cats, level: S.level
  }).then(qs => {
    S.questions = qs; S.idx = 0; S.results = []; S.transcript = ''; S.stats = null; S.answered = false; S.recording = false; S.screen = 'question';
    S.saveMsg = ''; S.saved = false; S.saving = false; S.finishedAt = null;
    S.sessionId = 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    busy(''); render(); resetScroll(); onQuestionShown();
  }).catch(e => { busy(''); S.error = e.message; render(); });
}
function beginSession() {
  if (S.micOk !== true) ensureMic().catch(err => { S.micOk = false; S.micMsg = micErrorMsg(err); renderStatus(); });
  startSession();
}
function evaluate() {
  const q = S.questions[S.idx];
  if (!S.transcript || S.transcript.trim().length < 5) { S.error = '回答が空です。録音するか、文字で回答を入力してください。'; return render(); }
  S.error = '';
  busy('回答を評価しています…（模範解答も作成します）', true);
  const an = analyze(S.transcript), sp = { an, stats: S.stats };
  api('evaluateAnswer', {
    question: q.text, intent: q.intent, category: q.category, level: S.level,
    transcript: maskText(S.transcript), skillText: maskText(S.skillText),
    secs: S.stats ? S.stats.secs : 0,
    projectText: q.category === 'pj' ? maskText(S.projectText) : '', prepText: q.category === 'prep' ? maskText(S.prepText) : ''
  }).then(raw => {
    if (!raw || raw.sample == null || !raw.axes) throw new Error('GAS側（Code.gs）が古い版のようです。最新のCode.gsを反映して、新バージョンとしてデプロイし直してください。');
    const fb = normFb(raw);
    S.fb = fb;
    S.results[S.idx] = {
      no: q.no, category: q.category, text: q.text, transcript: S.transcript, score: fb.score, axes: fb.axes,
      good: fb.good, improve: fb.improve, model: fb.model, sample: fb.sample, skipped: false,
      fillers: an.s, habits: an.h, speech: sp, pace: paceOf(sp), secs: S.stats ? S.stats.secs : null
    };
    S.screen = 'feedback'; busy(''); render(); resetScroll();
  }).catch(e => { busy(''); S.error = e.message; render(); });
}
function skip() {
  const q = S.questions[S.idx];
  S.results[S.idx] = { no: q.no, category: q.category, text: q.text, transcript: '', score: 0, skipped: true };
  goNext();
}
function goNext() {
  S.error = '';
  stopSpeak(); abortRec();
  if (S.idx >= S.questions.length - 1) return finish();
  S.idx++; S.transcript = ''; S.stats = null; S.answered = false; S.fb = null; S.screen = 'question';
  render(); resetScroll(); onQuestionShown();
}
function summary() {
  const valid = S.results.filter(r => r && !r.skipped);
  const total = valid.length ? Math.round(valid.reduce((a, r) => a + r.score, 0) / valid.length) : 0;
  return { valid, total };
}
const allAnswered = () => S.questions.length > 0 && S.results.length === S.questions.length && S.results.every(r => r && !r.skipped);
function finish() {
  S.screen = 'result'; S.finishedAt = new Date(); render(); resetScroll();
  if (allAnswered()) saveToSheet(true);
  else { S.saveMsg = 'スキップした質問があるため、自動保存は行っていません。必要な場合は「スプレッドシートに保存」を押してください。'; render(); }
}
function saveToSheet(auto) {
  if (S.saved || S.saving) return;
  S.saving = true; S.saveMsg = 'スプレッドシートに保存しています…'; render();
  const sm = summary();
  api('saveSession', {
    sessionId: S.sessionId, engineerName: effName(), level: S.level, total: sm.total, saveText: S.saveText,
    results: S.results.map(r => ({ no: r.no, category: r.category, text: r.text, transcript: r.transcript, score: r.score, axes: r.axes, good: r.good, improve: r.improve, skipped: r.skipped, fillers: r.fillers || 0, pace: r.pace, secs: r.secs }))
  }).then(r => {
    S.saving = false;
    if (r.saved) { S.saved = true; S.saveMsg = auto ? '全問に回答したため、結果をスプレッドシートへ自動保存しました。' : '結果をスプレッドシートに保存しました。'; }
    else S.saveMsg = '保存に失敗しました：' + (r.message || '');
    if (S.screen === 'result') render();
  }).catch(e => { S.saving = false; S.saveMsg = '保存に失敗しました：' + e.message; if (S.screen === 'result') render(); });
}
const resetScroll = () => { $('main').scrollTop = 0; };

/* ================= 結果の出力（テキスト／Word） ================= */
const p2 = n => ('0' + n).slice(-2);
const fmtDate = d => d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
const fileStamp = d => d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes());
function download(name, mime, content) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function catScores() {
  const by = {};
  summary().valid.forEach(r => { (by[r.category] = by[r.category] || []).push(r.score); });
  return Object.keys(by).map(k => ({ label: CATS[k] ? CATS[k].label : k, n: by[k].length, avg: Math.round(by[k].reduce((a, b) => a + b, 0) / by[k].length) }));
}
function speechLine(r) {
  const sp = r.speech; if (!sp) return '';
  let t = 'フィラー ' + sp.an.s + '回' + (sp.an.s ? '（' + listCountsPlain(sp.an.strong) + '）' : '') + '／口癖の候補 ' + sp.an.h + '回' + (sp.an.h ? '（' + listCountsPlain(sp.an.habit) + '）' : '');
  if (sp.stats && sp.stats.secs >= 10) t += '／回答時間 ' + mmss(sp.stats.secs) + '／話速 ' + r.pace + '文字/分／3秒以上の間 ' + sp.stats.pauses + '回';
  else t += '／文字数 ' + sp.an.chars + '字';

}
const axesLine = r => AXES.map(a => a.name + ' ' + r.axes[a.k] + '/25').join('　');

/* ================= 図表（レーダー・リング）とアニメーション ================= */
const RW = 320, RH = 232, RCX = 160, RCY = 116, RR = 64;
const rpt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / AXES.length; return [RCX + r * Math.cos(a), RCY + r * Math.sin(a)]; };

/** 4軸（各25点）のレーダーチャート。多角形は中心から描き始め、afterRender で「うにっ」と伸ばす */
function radarSvg(id, vals) {
  const n = AXES.length;
  let s = '<svg id="rd-' + id + '" data-radar="' + vals.join(',') + '" viewBox="0 0 ' + RW + ' ' + RH + '" width="100%" style="overflow:visible" role="img" aria-label="評価レーダーチャート（' + AXES.map((a, i) => a.name + ' ' + vals[i] + '点').join('、') + '）">';
  s += '<defs><linearGradient id="rg-' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5FBF" stop-opacity=".38"/><stop offset="1" stop-color="#7A4FD6" stop-opacity=".30"/></linearGradient></defs>';
  [0.2, 0.4, 0.6, 0.8, 1].forEach((f, gi) => {

const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function afterRender(animate) {
  const root = $('app');
  root.querySelectorAll('[data-radar]').forEach(el => {
    const vals = el.getAttribute('data-radar').split(',').map(Number);
    if (animate) tween(1000, easeOutBack, k => drawRadar(el, vals, k)); else drawRadar(el, vals, 1);

  root.querySelectorAll('[data-ring]').forEach(el => {
    const C = Number(el.getAttribute('data-c')), v = Number(el.getAttribute('data-ring'));
    const target = C * (1 - Math.max(0, Math.min(100, v)) / 100);

    else { el.style.transition = 'none'; el.style.strokeDashoffset = target; }

  if (S.recording) pri = '<button class="btn rec pulse" data-act="stop">■ 録音を停止</button>';
  else if (S.finalizing) pri = '<button class="btn" disabled>確定中…</button>';
  else if (S.answered) pri = '<button class="btn ghost" data-act="rec">録り直す</button><button class="btn" data-act="eval">回答を評価する</button>';
  else { sec += '<button class="btn plain" data-act="typeonly">文字で回答</button>'; pri = '<button class="btn" data-act="rec">' + svg('mic') + '録音を開始</button>'; }
  const bar = '<div class="bsec">' + sec + '</div><span class="grow"></span><div class="bpri">' + pri + '</div>';
  return { main, bar };
}

function vFeedback() {
  const q = S.questions[S.idx], fb = S.fb, r = S.results[S.idx], sp = r.speech, b = band(fb.score);
  const vals = AXES.map(a => fb.axes[a.k]);
  const axes = AXES.map(a => '<div class="axis"><div><span class="nm"><i style="background:' + a.color + '"></i>' + a.name + '</span><b>' + fb.axes[a.k] + ' / 25</b></div><div class="bar"><div data-w="' + (fb.axes[a.k] / 25 * 100) + '" style="background:' + a.color + '"></div></div></div>').join('');
  const sumline = AXES.map(a => fb.axes[a.k]).join(' + ') + ' = <b>' + fb.score + '</b> 点';

  // 話し方（フィラー・話速・間・回答時間）
  const an = sp.an, st = sp.stats;
  let chips = '<div class="stat ' + (an.s ? 'long' : 'ideal') + '"><b>' + an.s + '回</b>フィラー</div><div class="stat"><b>' + an.h + '回</b>口癖の候補</div>';
  if (st && st.secs >= 1) {
    const z = zoneOf(st.secs);
    chips += '<div class="stat ' + z.cls + '"><b>' + mmss(st.secs) + '</b>回答時間（目安0:30〜1:00）<em>' + z.label + '</em></div>';
    if (st.secs >= 10) chips += '<div class="stat"><b>' + r.pace + '文字/分</b>話速（目安250〜350）</div><div class="stat"><b>' + st.pauses + '回</b>3秒以上の間</div>';
  } else chips += '<div class="stat"><b>' + an.chars + '字</b>文字数（目安150〜300字）</div>';
  const adv = [];
  if (an.s > 0) adv.push('フィラー（' + listCounts(an.strong) + '）が出ています。言葉に詰まったら、言い淀まずに一呼吸おくと落ち着いて聞こえます。');
  if (an.h > 0) adv.push('口癖の候補（' + listCounts(an.habit) + '）があります。多用すると自信がない印象になるため、必要な場面だけに絞りましょう。');
  if (st && st.secs >= 1) {
    if (st.secs > 75) adv.push('回答が' + mmss(st.secs) + 'と長めです。要点を2〜3個に絞り、30〜60秒に収めましょう。');
    else if (st.secs > 60) adv.push('回答がやや長めです。具体例を1つに絞ると、60秒以内に収まります。');
    else if (st.secs < 20) adv.push('回答が短めです。理由と具体例を1つずつ足して、30秒以上を目指しましょう。');
    if (st.secs >= 10) {
      if (r.pace > 380) adv.push('話すスピードがやや速めです。要点ごとに間を置くと、聞き手が理解しやすくなります。');
      if (r.pace < 200) adv.push('話すスピードがゆっくりめです。結論を先に言い切ると、テンポが良くなります。');
      if (st.pauses >= 2) adv.push('3秒以上の間が' + st.pauses + '回ありました。話す順番（結論→理由→例）を決めておくと、間が減ります。');
    }
  } else {
    if (an.chars > 350) adv.push('文字数が多めです。30〜60秒で話せる150〜300字程度に絞りましょう。');
    else if (an.chars < 100) adv.push('文字数が少なめです。理由と具体例を足すと、30秒以上の回答になります。');
  }
  if (!adv.length) adv.push('フィラーや話し方の大きな問題は見つかりませんでした。');

  const main = '<div class="stack">' +
    '<div class="g2">' +
    '<div class="card a-blue">' + ch('chart', '', 'この回答の評価', '<span class="bandbadge" style="background:' + b.bg + ';color:' + b.color + '">' + b.label + '</span>') +
    '<div class="evalbox">' + ringHtml('s', fb.score) + '<div class="radar">' + radarSvg('q', vals) + '</div></div>' +
    '<div class="axes">' + axes + '</div><div class="sumline">' + sumline + '（4軸の合計）</div></div>' +
    '<div class="card">' + ch('target', 'teal', 'あなたの回答', '<span class="tag">Q' + q.no + ' / ' + S.questions.length + '</span>') +
    '<div style="font-size:15px;font-weight:700;line-height:1.7">' + esc(q.text) + '</div>' +
    '<div class="scroll" style="max-height:230px;font-size:14px;line-height:1.95;white-space:pre-wrap;background:#F7F9FC;border-radius:12px;padding:12px">' + highlight(S.transcript) + '</div>' +
    '<span class="small"><mark class="m1">濃い色</mark>＝フィラー、<mark class="m2">薄い色</mark>＝口癖の候補</span></div>' +
    '</div>' +
    '<div class="g2">' +
    '<div class="card a-green">' + ch('check', 'green', '良かった点') + '<div class="sec good"><p>' + esc(fb.good) + '</p></div>' +
    '<div style="height:1px;background:var(--line)"></div>' + ch('up', 'orange', '改善ポイント') + '<div class="sec warn"><p>' + esc(fb.improve) + '</p></div></div>' +
    '<div class="card a-purple">' + ch('mic', 'purple', '話し方のチェック') + '<div class="chips">' + chips + '</div><p class="note">' + adv.join('<br>') + '</p>' +
    '<span class="small">Chromeの音声認識は言い淀みを自動で省くことがあり、実際より少なく表示される場合があります。</span></div>' +
    '</div>' +
    '<div class="card model">' + ch('book', '', '模範解答の骨子') + '<p>' + esc(fb.model) + '</p>' +
    '<div class="row-inline"><button class="btn min" data-act="opensample">' + svg('spark') + '模範解答を見る（テキスト）</button><span class="small">あなたの回答と並べて確認できます</span></div></div>' +
    '</div>';
  const bar = '<div class="bsec">' + '<button class="btn ghost" data-act="opensample">' + svg('spark') + '模範解答を見る</button></div><span class="grow"></span><div class="bpri"><button class="btn" data-act="next">' + (S.idx >= S.questions.length - 1 ? '結果を見る' : '次の質問へ') + '</button></div>';
  return { main, bar };
}

function vResult() {
  const sm = summary(), b = band(sm.total);
  const avgAxes = AXES.map(a => { const v = sm.valid.map(r => r.axes[a.k]); return v.length ? Math.round(v.reduce((x, y) => x + y, 0) / v.length * 10) / 10 : 0; });
  const cats = catScores().map(c => '<div class="axis"><div><span class="nm">' + esc(c.label) + '（' + c.n + '問）</span><b>' + c.avg + '</b></div><div class="bar" style="height:11px"><div data-w="' + c.avg + '" style="background:' + band(c.avg).color + '"></div></div></div>').join('');

  const axAvg = AXES.map((a, i) => ({ k: a.k, avg: sm.valid.length ? avgAxes[i] : 25 })).sort((x, y) => x.avg - y.avg);
  const tips = axAvg.slice(0, 2).map(a => '<div class="tip"><b>' + TIPS[a.k][0] + '（平均 ' + a.avg.toFixed(1) + ' / 25）</b>' + TIPS[a.k][1] + '</div>');
  let fTotal = 0, mins = 0;
  sm.valid.forEach(r => { fTotal += r.fillers || 0; if (r.speech && r.speech.stats) mins += r.speech.stats.secs / 60; });
  if (sm.valid.length && (fTotal >= 5 || (mins > 0 && fTotal / mins >= 3))) tips.push('<div class="tip"><b>フィラーを減らす（全体で' + fTotal + '回）</b>「えー」「あのー」が目立ちます。言い淀みそうなときは、一呼吸おいてから話し始めましょう。</div>');
  else if (tips.length < 3 && axAvg[2]) tips.push('<div class="tip"><b>' + TIPS[axAvg[2].k][0] + '（平均 ' + axAvg[2].avg.toFixed(1) + ' / 25）</b>' + TIPS[axAvg[2].k][1] + '</div>');

  const rows = S.results.map(r => '<div class="tbl-row"><span class="small" style="width:22px">' + r.no + '</span><span class="tag">' + esc((CATS[r.category] || {}).label || '') + '</span><span class="tx">' + esc(r.text) + '</span>' +
    (r.skipped ? '<span class="small">スキップ</span>' : '<b style="color:' + band(r.score).color + ';font-size:16px">' + r.score + '</b>') + '</div>').join('');

  const saveCard = '<div class="card">' + ch('download', 'green', '結果の保存・出力') +
    (S.saveMsg ? '<div class="' + (S.saved ? 'okmsg' : 'note') + '" role="status">' + esc(S.saveMsg) + '</div>' : '') +
    '<p class="small">全問に回答した場合は、結果をスプレッドシートへ自動保存します。スキップがある場合は、下のボタンで手動保存できます。</p>' +
    (S.saved ? '' : '<div class="row-inline"><button class="btn ghost min" data-act="savesheet"' + (S.saving ? ' disabled' : '') + '>スプレッドシートに保存</button></div>') + '</div>';

  const main = '<div class="g2"><div class="col">' +
    '<div class="card a-blue">' + ch('chart', '', '総合スコア', '<span class="bandbadge" style="background:' + b.bg + ';color:' + b.color + '">' + b.label + '</span>') +
    '<div class="evalbox">' + ringHtml('t', sm.total) + '<div class="radar">' + (sm.valid.length ? radarSvg('t', avgAxes) : '') + '</div></div>' +
    '<p class="note">回答した' + sm.valid.length + '問の平均です（4軸の平均をレーダーに表示）。</p></div>' +
    '<div class="card fill">' + ch('list', 'teal', 'ジャンル別スコア') + (cats || '<p class="note">回答がありません。</p>') + '</div>' + saveCard + '</div>' +
    '<div class="col">' +
    '<div class="card a-orange">' + ch('up', 'orange', '次回に向けた重点ポイント') + (sm.valid.length ? tips.join('') : '<p class="note">回答がありません。</p>') + '</div>' +
    '<div class="card fill">' + ch('file', '', '各質問の結果') + '<div class="scroll" style="max-height:340px">' + rows + '</div></div></div></div>';
  const bar = '<div class="bsec"><button class="btn ghost" data-act="exptxt"' + (sm.valid.length ? '' : ' disabled') + '>テキスト保存</button><button class="btn ghost" data-act="expdoc"' + (sm.valid.length ? '' : ' disabled') + '>Word保存</button>' +
    '<button class="btn ghost" data-act="back">設定に戻る</button></div><span class="grow"></span><div class="bpri"><button class="btn" data-act="restart">新しい10問で練習する</button></div>';
  return { main, bar };
}

/* ================= イベント ================= */
document.addEventListener('click', e => {
  if (e.target === $('dlg')) { closeSample(); return; }
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.getAttribute('data-act'), k = t.getAttribute('data-k');
  if (a === 'cat') toggleCat(k);
  else if (a === 'lv') setLevel(k);
  else if (a === 'pick') $('file').click();
  else if (a === 'pickprep') $('prepfile').click();
  else if (a === 'clearprep') { S.prepText = ''; S.prepInfo = ''; updateOpt(); updateGenres(); }
  else if (a === 'opt') { S.optOpen = !S.optOpen; updateOpt(); }
  else if (a === 'login') saveLogin();
  else if (a === 'relogin') { S.loginOpen = true; render(); }
  else if (a === 'mic') checkMic();
  else if (a === 'vtest') speak('これまでのご経歴を、直近の案件を中心に教えてください。');
  else if (a === 'start' || a === 'restart') beginSession();
  else if (a === 'back') { stopSpeak(); abortRec(); S.screen = 'setup'; S.error = ''; render(); }
  else if (a === 'rec') startRec();
  else if (a === 'stop') stopRec();
  else if (a === 'qvoice') toggleQVoice();
  else if (a === 'speak') speak(S.questions[S.idx].text);
  else if (a === 'opensample') openSample();
  else if (a === 'closedlg') closeSample();
  else if (a === 'speaksample') speak(S.fb.sample);
  else if (a === 'copysample') { const txt = S.fb.sample; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('模範解答をコピーしました')).catch(() => toast('コピーできませんでした')); }
  else if (a === 'typeonly') { stopSpeak(); S.answered = true; S.transcript = ''; S.stats = null; render(); const tx = $('tx'); if (tx) tx.focus(); }
  else if (a === 'eval') evaluate();
  else if (a === 'skip') skip();
  else if (a === 'next') { stopSpeak(); goNext(); }
  else if (a === 'savesheet') saveToSheet(false);
  else if (a === 'exptxt') exportText();
  else if (a === 'expdoc') exportWord();
});
document.addEventListener('change', e => {
  if (e.target.id === 'file' && e.target.files[0]) readSkillExcel(e.target.files[0]);
  if (e.target.id === 'prepfile' && e.target.files.length) readPrepFiles(e.target.files);
  const act = e.target.getAttribute && e.target.getAttribute('data-act');
  if (act === 'mask') { S.mask = e.target.checked; updateSum(); }
  if (act === 'autoRead') S.autoRead = e.target.checked;
  if (act === 'autoRec') S.autoRec = e.target.checked;
  if (act === 'saveText') S.saveText = e.target.checked;
  const sel = e.target.getAttribute && e.target.getAttribute('data-sel');
  if (sel === 'voiceName') { S.voiceName = e.target.value; store('it_voice', S.voiceName || null); }
  if (sel === 'rate') { S.rate = Number(e.target.value) || 1.0; store('it_rate', String(S.rate)); }
});
document.addEventListener('input', e => {
  const b = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!b) return;
  S[b] = e.target.value;
  if (b === 'engineerName') S.engineerNameTouched = true;
  if (b === 'projectText') updateGenres();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'un' || e.target.id === 'tk')) saveLogin(); });
document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('#drop')) e.preventDefault(); });
document.addEventListener('drop', e => {
  if (e.target.closest && e.target.closest('#drop')) {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && /\.(xlsx|xls)$/i.test(f.name)) readSkillExcel(f); else { S.error = 'Excelファイル（.xlsx / .xls）を選択してください。'; render(); }
  }
});
$('dlg').addEventListener('close', () => stopSpeak());
window.addEventListener('beforeunload', () => stopSpeak());

/* ================= 起動 ================= */
if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = fillVoiceSelect; } catch (e) {} }
S.userName = load('it_user'); S.token = load('it_token');
S.voiceName = load('it_voice'); S.rate = Number(load('it_rate')) || 1.0;
render();
if (S.token && S.userName && API_OK) {
  api('status').then(st => { checkStatus(st); if (S.screen === 'setup') render(); })
    .catch(e => {
      S.error = e.message; if (/合言葉/.test(e.message)) { S.token = ''; store('it_token', null); S.loginOpen = true; }
      if (S.screen === 'setup') render();
    });
}
</script>
</body>
</html>
